<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KapuMail – dokumentumközpont</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/kapu.css">
<style>
:root{
  --ink:#1a1733; --ink-2:#4a4666; --ink-3:#6b6786;
  --rail:#15131c; --rail-ico:#b9b5cc;
  --violet:#4a36e0; --violet-soft:#ebe8ff;
  --line:rgba(40,30,90,.10);
  --glass:rgba(255,255,255,.46); --glass-strong:rgba(255,255,255,.72); --solid:rgba(255,255,255,.94);
  --amber:#8a4b00; --amber-bg:#ffedd1;
  --green:#0d6b45; --green-bg:#dcf5e8;
  --red:#a3193a; --red-bg:#ffe1e7;
  --blue:#1c4fa8; --blue-bg:#e0ebff;
  --grey:#4f4b66; --grey-bg:#ecebf3;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 18px 50px -18px rgba(60,35,120,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Figtree,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);
  background:#eadff5;overflow:hidden;
}
/* Húzható ablaksáv a rejtett natív címsor helyén (asztali app) + alatta a frissítési csík.
   Átlátszó keretben ülnek a háttér (.bg színfoltok) fölött, a főablak (.app) pedig automatikusan helyet hagy nekik (--upd-h). */
.tophead{position:fixed;top:0;left:0;right:0;z-index:60;-webkit-app-region:drag;background:transparent}
.winbar{height:28px;background:transparent;display:flex;justify-content:center;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.2px;color:rgba(48,34,92,.52);white-space:nowrap;overflow:hidden;padding:0 84px}
.winbar .wb-i{display:inline-flex;align-items:center;gap:5px;font-weight:500}.winbar .wb-i b{font-weight:600;color:rgba(48,34,92,.78)}.winbar svg{width:12px;height:12px}
.winbar .wb-sep{width:1px;height:12px;background:rgba(48,34,92,.22);flex:none}
.winbar button.wb-next{-webkit-app-region:no-drag;cursor:pointer;font:inherit;border:0}.winbar button.wb-next:hover{background:rgba(74,54,224,.16)}.winbar .wb-next.off{background:rgba(48,34,92,.07);color:rgba(48,34,92,.62)}.winbar .wb-next.off b{color:rgba(48,34,92,.8)}.winbar .wb-next.off:hover{background:rgba(74,54,224,.12);color:var(--violet)}
.winbar .wb-next{padding:2px 9px 2px 7px;border-radius:999px;background:rgba(74,54,224,.1);color:var(--violet)}.winbar .wb-next b{color:var(--violet)}
/* Frissítési csík (KapuMail színvilágban, a felső sávban) */
.upd-banner{position:relative;overflow:hidden;-webkit-app-region:no-drag;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:40px;margin:1px 14px 7px;padding:5px 6px 5px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.88);background:linear-gradient(90deg,rgba(255,255,255,.82) 0%,rgba(239,234,255,.88) 52%,rgba(252,235,246,.84) 100%);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);box-shadow:0 10px 26px -16px rgba(74,54,224,.4),inset 0 0 0 1px rgba(74,54,224,.15);font-size:13px;color:var(--ink)}
.upd-banner[hidden]{display:none}
.upd-banner[data-phase]{min-height:42px;padding-block:5px}
.upd-ico{display:none}
.upd-banner[data-phase] .upd-ico{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;margin-left:-4px;border-radius:50%;color:#fff;font:700 11px/1 system-ui,sans-serif}
.upd-banner[data-phase="downloading"] .upd-ico,.upd-banner[data-phase="verifying"] .upd-ico,.upd-banner[data-phase="restarting"] .upd-ico{background:conic-gradient(from 0deg,transparent 0 55%,#9b7bff 82%,var(--violet));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));animation:upd-spin .9s linear infinite}
.upd-banner[data-phase="ready"] .upd-ico{background:linear-gradient(135deg,#5d48f6 0%,var(--violet) 60%,#9333ea 100%);box-shadow:0 0 0 4px rgba(74,54,224,.15);animation:upd-pop .45s cubic-bezier(.34,1.56,.64,1)}
.upd-banner[data-phase="ready"] .upd-ico::before{content:"✓"}
.upd-banner[data-phase="failed"] .upd-ico{background:#d97706}
.upd-banner[data-phase="failed"] .upd-ico::before{content:"!"}
.upd-banner[data-phase="ready"]{border-color:rgba(124,58,237,.34);background:radial-gradient(circle at 0% 50%,rgba(124,58,237,.16),transparent 45%),radial-gradient(circle at 100% 50%,rgba(212,80,140,.14),transparent 42%),rgba(255,255,255,.86);box-shadow:0 10px 28px -16px rgba(74,54,224,.55)}
.upd-txt{font-weight:600;color:var(--ink)}
.upd-notes{color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:2px}.upd-notes:hover{color:#3522b8}
.upd-detail{color:var(--ink-2)}
.upd-pct{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--violet)}
.upd-acts{display:flex;gap:6px;margin-left:auto;align-items:center}
.upd-btn{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:transform .18s,box-shadow .18s,background .15s}
.upd-btn.pri{background:linear-gradient(135deg,#5e49f6 0%,var(--violet) 58%,#7c3aed 100%);color:#fff;box-shadow:0 6px 14px -5px rgba(74,54,224,.58),inset 0 1px 0 rgba(255,255,255,.28)}
.upd-btn.pri:hover{transform:translateY(-1px);box-shadow:0 9px 18px -5px rgba(74,54,224,.7),inset 0 1px 0 rgba(255,255,255,.34)}
.upd-btn.sec{background:rgba(255,255,255,.72);color:var(--ink-2);box-shadow:inset 0 0 0 1px rgba(48,34,92,.13)}
.upd-btn.sec:hover{background:#fff;color:var(--ink)}
.upd-prog{position:absolute;inset:auto 0 0;height:3px;background:rgba(74,54,224,.12)}
.upd-fill{position:relative;display:block;width:var(--upd-pct,0%);height:100%;overflow:hidden;border-radius:0 3px 3px 0;background:linear-gradient(90deg,var(--violet) 0%,#8b5cf6 60%,#d4508c 100%);transition:width .3s ease-out}
.upd-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:upd-shine 1.6s ease-in-out infinite}
.upd-prog.is-indet .upd-fill{width:32%;border-radius:3px;animation:upd-sweep 1.3s ease-in-out infinite}
@keyframes upd-spin{to{transform:rotate(360deg)}}
@keyframes upd-pop{from{transform:scale(.3);opacity:0}}
@keyframes upd-shine{to{transform:translateX(100%)}}
@keyframes upd-sweep{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){.upd-btn.pri,.upd-banner[data-phase] .upd-ico,.upd-fill,.upd-fill::after,.upd-prog.is-indet .upd-fill{animation:none;transition:none}.upd-btn.pri:hover{transform:none}.upd-prog.is-indet .upd-fill{width:100%;opacity:.5}}
/* Keskeny ablakban előbb a mód magyarázata, aztán a mód, végül az utolsó frissítés marad el: a következő frissítés látszik legtovább. */
@media (max-width:1180px){.winbar .wb-mode-l{display:none}}
@media (max-width:820px){.winbar .wb-mode,.winbar .wb-mode+.wb-sep{display:none}}
@media (max-width:560px){.winbar .wb-last,.winbar .wb-last+.wb-sep{display:none}}
/* előtöltő */
.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(135deg,#f6dbe9 0%,#e6dbf7 38%,#dcd8fa 62%,#f7e4dc 100%);transition:opacity .45s ease,visibility .45s}
.boot.off{opacity:0;visibility:hidden;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;transition:transform .45s ease}
.boot.off .boot-in{transform:scale(1.04)}
.boot-st{position:relative;width:132px}
.boot img{position:relative;z-index:1;width:132px;height:auto;display:block;animation:bootbob 2.2s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(70,40,130,.18));user-select:none;-webkit-user-drag:none}
.boot-ring{position:absolute;left:50%;top:66%;width:260px;height:110px;margin:-55px 0 0 -130px;overflow:visible;pointer-events:none;fill:none;stroke:rgba(74,54,224,.3);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 7}
.boot-ring.bk{z-index:0;opacity:.6}.boot-ring.fr{z-index:2}
.boot-orb{position:absolute;left:50%;top:66%;width:0;height:0;animation:orbx 6.4s cubic-bezier(.37,0,.63,1) infinite,orbz 6.4s step-end infinite;animation-delay:var(--d)}
.boot-orb s{position:absolute;left:-13px;top:-13px;width:26px;height:26px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.94);box-shadow:0 6px 14px -4px rgba(60,35,120,.35),inset 0 0 0 1px rgba(255,255,255,.9);text-decoration:none;animation:orby 6.4s cubic-bezier(.37,0,.63,1) infinite;animation-delay:calc(var(--d) - 4.8s)}
.boot-orb svg{width:15px;height:15px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes orbx{0%,100%{transform:translate(-118px,14px)}50%{transform:translate(118px,-14px)}}
@keyframes orby{0%,100%{transform:translateY(-30px) scale(.7);opacity:.7}50%{transform:translateY(30px) scale(1.08);opacity:1}}
@keyframes orbz{0%{z-index:0}50%,100%{z-index:2}}
.boot i{width:74px;height:10px;border-radius:50%;background:rgba(60,35,120,.16);filter:blur(5px);margin-top:6px;animation:bootsh 2.2s ease-in-out infinite}
.boot b{margin-top:18px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.boot u{display:block;margin-top:16px;width:92px;height:3px;border-radius:3px;background:rgba(74,54,224,.13);overflow:hidden;position:relative;text-decoration:none}
.boot u::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;border-radius:3px;background:var(--violet);animation:bootbar 1.15s ease-in-out infinite}
@keyframes bootbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes bootsh{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.8);opacity:.6}}
@keyframes bootbar{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.boot img,.boot i,.boot u::after{animation:none}.boot u::after{width:100%;opacity:.4}.boot-orb{display:none}}
.syncov .boot-in{max-width:min(440px,calc(100vw - 32px));text-align:center}
.syncov p{margin:0}
.sy-who{margin-top:14px!important;font-size:17px;font-weight:600;color:var(--ink);min-height:1.4em;overflow-wrap:anywhere}
.sy-box{font-size:13.5px;color:var(--ink-2);min-height:1.4em}
.sy-bar{margin-top:14px;width:220px;height:5px;border-radius:5px;background:rgba(74,54,224,.13);overflow:hidden}
.sy-bar span{display:block;height:100%;width:0;border-radius:5px;background:var(--violet);transition:width .5s ease}
.sy-bar.ind{position:relative}.sy-bar.ind span{position:absolute;inset:0 auto 0 0;width:40%;transition:none;animation:bootbar 1.15s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sy-bar.ind span{animation:none;width:100%;opacity:.4}}
.sy-cnt{margin-top:8px!important;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sy-last{margin-top:4px!important;font-size:12.5px;color:var(--ink-3);min-height:1.4em;max-width:min(440px,calc(100vw - 32px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sy-why{margin-top:16px!important;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.sy-acts{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.syncov .btn{padding:7px 14px;background:rgba(255,255,255,.6)}
/* háttér: pasztell üvegfal */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:linear-gradient(135deg,#f6dbe9 0%,#e6dbf7 38%,#dcd8fa 62%,#f7e4dc 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg i:nth-child(1){width:52vw;height:52vw;left:-14vw;top:-18vw;background:#f3b7d6}
.bg i:nth-child(2){width:46vw;height:46vw;right:-10vw;top:8vh;background:#b9b0f6}
.bg i:nth-child(3){width:40vw;height:40vw;left:28vw;bottom:-26vw;background:#ffd9c2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ablak */
.app{position:fixed;top:calc(30px + var(--upd-h,0px));right:14px;bottom:14px;left:14px;display:grid;grid-template-columns:auto 404px minmax(0,1fr);
  border-radius:39px;background:var(--glass);
  border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);overflow:hidden}

/* a háttér elmosása álelemen van, hogy a belső üveglapok (pl. kis ablakban a mappasáv) saját elmosása is működjön */
.app::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);pointer-events:none}

/* bal: sín + mappák */
.app{grid-template-rows:minmax(0,1fr)}
.side{display:flex;min-width:0;min-height:0;border-right:1px solid var(--line)}
.list,.detail{min-height:0}
.rail{overflow:visible}
.rail button{flex:none}
.rail{position:relative;margin:14px 0 14px 14px;width:58px;border-radius:24px;background:var(--rail);color:var(--rail-ico);
  display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;gap:4px}
.mark{flex:none;width:46px;height:auto;margin:-6px 0 10px;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));user-select:none;-webkit-user-drag:none}
.rail .markb{position:relative;width:auto;height:auto;margin:-6px 0 10px;padding:0;border-radius:14px;background:none;display:block;transition:transform .18s cubic-bezier(.2,.8,.3,1.2)}
.rail .markb .mark{margin:0;transition:opacity .14s ease,filter .18s}
.rail .markb .mark.hov{position:absolute;top:0;left:0;opacity:0;pointer-events:none}
.rail .markb:hover,.rail .markb:focus-visible{background:none;transform:translateY(-2px) scale(1.05)}
.rail .markb:hover .mark.base,.rail .markb:focus-visible .mark.base{opacity:0}
.rail .markb:hover .mark.hov,.rail .markb:focus-visible .mark.hov{opacity:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28)) drop-shadow(0 0 10px rgba(206,184,255,.75)) drop-shadow(0 0 4px rgba(244,166,198,.6))}
.rail .markb:active{transform:translateY(0) scale(.97)}
.rail .markb:focus-visible{outline:2px solid #cdb8ff;outline-offset:3px}
.rail button{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;position:relative}
.rail button:hover{background:rgba(255,255,255,.09);color:#fff}
.rail button[aria-current="true"]{background:#fff;color:var(--rail)}
.rail .cnt{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ff7a59;color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--rail)}
.ntf{display:flex;gap:12px;align-items:flex-start;padding:11px 10px;border-radius:12px;margin:0 -10px}
.ntf+.ntf{margin-top:2px}
.ntf.new{background:rgba(74,54,224,.045)}
.ntf .ni{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.ntf .ni .i{width:17px;height:17px}
.ntf .nb{min-width:0;flex:1}
.ntf .nb small{display:block;color:var(--ink-3);margin-top:2px}
.ntf .nd{flex:none;width:7px;height:7px;border-radius:50%;background:var(--violet);opacity:.55;margin-top:8px}
.ntf-list{max-height:min(52vh,460px);overflow:auto;padding:0 10px;margin:0 -10px}
.ntf-h{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 4px}
.ntf-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 -26px;border-top:1px solid var(--line);padding:14px 0}
.ntf-foot button{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2);padding:6px 8px;border-radius:9px;margin:0 -8px}.ntf-foot button:hover:not(:disabled){background:rgba(74,54,224,.07);color:var(--ink)}.ntf-foot button:disabled{opacity:.45;cursor:default}.ntf-foot .i{width:16px;height:16px}.ntf-foot .all{color:var(--ink);margin-left:auto}
.ntf-page{padding:6px 22px 16px;max-width:820px}.ntf-page .ntf-h:first-child{margin-top:12px}
.dlg{position:relative}.dlgx{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}.dlgx:hover{background:rgba(74,54,224,.08);color:var(--ink)}.dlgx .i{width:18px;height:18px}
.rail .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#ff7a59;border:2px solid var(--rail)}
.rail .sp{flex:1}
.rail .collapse{position:absolute;right:-13px;top:73px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);
  box-shadow:0 4px 12px rgba(30,20,80,.25);display:grid;place-items:center;z-index:3}
.rail .collapse:hover{background:#fff;color:var(--violet)}
.collapse svg{width:14px;height:14px;transition:transform .2s}
.app.nofold .rail .collapse:hover{background:#fff;color:var(--violet)}
.app.nofold .collapse svg{transform:rotate(180deg)}
.folders{width:252px;padding:20px 12px 14px 22px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.app:not(.nofold) .folders{display:none}.app:not(.nofold) .side{border-right:0;background:rgba(255,255,255,.22)}
.folders h1{font-size:22px;margin:14px 6px 14px;letter-spacing:-.02em}
.vrow{display:flex;align-items:center}.vrow .f{flex:1;min-width:0}.vdel{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .12s}.vdel svg{width:14px;height:14px}.vrow:hover .vdel,.vdel:focus-visible{opacity:1}.vdel:hover{background:rgba(180,40,60,.1);color:var(--red)}@media (hover:none){.vdel{opacity:1}}
.folders .h2r{display:inline-flex;align-items:center;gap:8px}.folders .addc{padding:0 4px;font-size:17px;line-height:1;font-weight:500;color:var(--ink-3)}.folders .addc:hover:not(:disabled){color:var(--violet)}.folders .addc:disabled{opacity:.4;cursor:not-allowed}
.folders h2{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:18px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.f{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;text-align:left;color:var(--ink-2);font-weight:500}
.f:hover{background:rgba(255,255,255,.5)}
.f[aria-current="true"]{background:var(--solid);color:var(--ink);font-weight:600;box-shadow:0 6px 16px -10px rgba(60,35,120,.5)}
.f .n{flex:none;margin-left:auto;font-size:12px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.6)}
.f[aria-current="true"] .n{background:var(--violet);color:#fff}
.f .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.csearch{margin:0 0 6px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.55);width:100%}
.cdot{width:9px;height:9px;border-radius:50%;flex:none;background:#2aa56f}
.cdot.bad{background:none;border-radius:0;width:0;height:0;border:5.5px solid transparent;border-bottom:10px solid #d2542f;border-top:0}

/* közép: lista */
.list{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:rgba(255,255,255,.22)}
.lhead{padding:20px 18px 10px}
.lhead .t{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-left:-8px}
.lhead h2{font-size:22px;margin:0 auto 0 8px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
let SYNCBUSY=false, TODAY='', ME='', MEU={name:''}, OFFICE={settings:{}}, PEOPLE={}, ROLES={}, CLIENTS=[], M=[], MALL=[], RULES=[], AUDIT=[], SYNCS=[], APPR=[], NOTIF=[], VIEWSV=[], POL={}, TYPES=[], PORTALS=[], DISCOVERED=[], OBLIGATIONS=[], PORTAL_CODES={}, LIVEDL_BUSY=null, LIVEDL_NOTE='', UPO_BUSY=false, SUBJECTS=[];
const ROLE_N={admin:'admin',vezeto:'vezető',konyvelo:'könyvelő'};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const canAdmin=()=>['admin','vezeto'].includes(MEU.role);
const canDecide=a=>canAdmin()&&a.by!==ME;
const needBox=c=>(SYNCS.find(s=>s.c&&s.c.id===c.id&&s.st==='need')||{}).id||'';
const NKIND={
  szabaly:{l:'Új irat szabály alapján',i:'inbox',c:'blue',d:'Ha egy szabály „Felelősnek azonnal” vagy „Vezetőnek azonnal” értesítést ír elő, a szinkronban érkező új iratról szól.'},
  jovahagyas:{l:'Átvételi jóváhagyás',i:'shield',c:'amber',d:'Vezetőként: valaki átvételt kért, a döntésedre vár. Kérelmezőként: a kérésedet jóváhagyták vagy elutasították, az indoklással.'},
  hatarido:{l:'Határidő-emlékeztető',i:'clock',c:'red',d:'A rád osztott, megerősített határidejű iratokról, a beállított napokkal a lejárat előtt (alapból 5, 2 és 1 nap). Becsült határidőről nem megy.'},
  szinkron:{l:'Leállt szinkron',i:'sync',c:'amber',go:'sync',d:'Ha egy tárhely szinkronja leáll (például lejárt a hitelesítés), az ügyfelet látó munkatársak és a vezetők kapják, tárhelyenként naponta legfeljebb egyszer.'},
  meghatalmazas:{l:'Meghatalmazás',i:'lock',c:'red',go:'clients',d:'14 és 3 nappal a meghatalmazás lejárta előtt, és egyszer a lejárat után. Lejárt meghatalmazással tárhelyművelet nem indítható.'},
  _:{l:'Értesítés',i:'bell',c:'grey',d:''}};
const isDirty=r=>r.pri!==r.saved.pri||r.as!==r.saved.as||r.notify!==r.saved.notify||r.dlMode!==r.saved.dlMode;
const XSRF=()=>decodeURIComponent((document.cookie.match(/XSRF-TOKEN=([^;]+)/)||[])[1]||'');
async function api(method,path,body){
  const form=body instanceof FormData;
  const r=await fetch('/api/'+path,{method,credentials:'same-origin',headers:{'Accept':'application/json','X-XSRF-TOKEN':XSRF(),...(body&&!form?{'Content-Type':'application/json'}:{})},body:body?(form?body:JSON.stringify(body)):undefined});
  if(r.status===401||r.status===419){location.href='/login';throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(r.status===402&&j&&j.trialExpired){if(j.license)OFFICE.license=j.license;TRIAL.dismissed=false;trialRender(true);throw new Error('trial')}
  if(!r.ok){toast(esc(j.message||'A művelet nem sikerült'),true);throw new Error(j.message||r.status)}
  return j;
}
async function load(){
  const s=await api('GET','state');
  TODAY=s.today;ME=s.me.k;MEU=s.me;OFFICE=s.office;PEOPLE={};ROLES={};s.people.forEach(p=>{PEOPLE[p.k]=esc(p.name);ROLES[p.k]=p});
  CLIENTS=s.clients;MALL=s.messages;syncHid();PORTALS=s.portals||[];ASPST=s.aspStatements||[];NAVRET=s.navReturns||[];NAVDOC=s.navDocuments||[];DISCOVERED=s.discovered||[];SUBJECTS=s.subjects||[];OBLIGATIONS=s.obligations||[];
  const old=Object.fromEntries(RULES.map(r=>[r.id,r]));
  RULES=s.rules.map(r=>{const dm=r.dlMode||'manual',o=old[r.id],x={...r,dlMode:dm,saved:{pri:r.pri,as:r.as,notify:r.notify,dlMode:dm}};return o&&isDirty(o)?{...x,pri:o.pri,as:o.as,notify:o.notify,dlMode:o.dlMode}:x});
  AUDIT=s.audit;SYNCS=s.syncs.map(x=>({...x,c:C(x.c)})).filter(x=>x.c);APPR=s.approvals;NOTIF=s.notifications;VIEWSV=s.views;POL=s.policies;TYPES=s.types;
  pushSeen();
  S.rem=Object.fromEntries([5,2,1].map(n=>[n,(s.office.settings.reminders||[]).includes(n)]));
  if(S.sel&&!M.find(m=>m.id===S.sel))S.sel=null;
  MODE_TXT=$('#proto').textContent=OFFICE.single?'Helyi mód – minden adat ezen a gépen marad':OFFICE.mode==='demo'?(OFFICE.live_download?'Hibrid mód – mintaadatok + élő ÜK+/DÁP letöltés és NAV ügyfélportál engedélyezve':'Demó mód – kitalált mintaadatok, élő tárhely nélkül'):'Élő mód';renderWinbar();
  document.documentElement.toggleAttribute('data-single',!!OFFICE.single);
  refreshPortalCodes();
  render();
  onbSync();
  await termsSync();
  trialSync();
  updRender();
  calInvAuto();
}
const run=async(fn,msg)=>{try{const r=await fn();await load();if(msg)toast(typeof msg==='function'?msg(r):msg);return r}catch(e){if(e.message!=='auth'&&e.message!=='trial')console.warn(e.message)}};
function writeHash(){const o={a:S.area,f:S.folder,c:S.client,q:S.q,g:S.seg,b:S.box,s:S.snd,r:S.hideRcpt?1:0,d:S.hideDur?1:0,m:S.sel,v:S.cv};history.replaceState(null,'','#'+new URLSearchParams(Object.entries(o).filter(([k,v])=>v!==null&&v!=='')).toString())}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(!p.has('a'))return;Object.assign(S,{area:p.get('a'),folder:p.get('f')||'all',client:p.get('c'),q:p.get('q')||'',seg:p.get('g')||'all',box:p.get('b')||'',snd:p.get('s')||'',hideRcpt:p.get('r')!=='0',hideDur:p.get('d')==='1',sel:p.get('m'),cv:p.get('v')});$('#q').value=S.q}

const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const $=s=>document.querySelector(s);
const C=id=>CLIENTS.find(c=>c.id===id);
// Önkormányzati portál (ASP): saját néven automatikus háttérolvasás, ügyfelekhez osztott képernyős szinkronablak pipákkal (ADR-011).
let ASPST=[], ASPBUSY=false, ASP_HOOKED=false;
const ASPDESK=()=>window.iratkapuDesktop&&window.iratkapuDesktop.asp;
// A portál szerverhibával válaszol, ha az alanynak az adott önkormányzatnál nincs nyilvántartott adata (élőben így láttuk).
const aspNoData=r=>(r.notes||[]).some(n=>/HTTP 5\d\d/.test(n));
const aspIngestBody=r=>({subject:{own:!!r.subject.own,role:r.subject.role||null,id:r.subject.id||null},tenants:(r.tenants||[]).map(t=>({uid:t.uid,name:t.name,city:t.city,balance:t.balance?{year:t.balance.year,kind:t.balance.kind,status:t.balance.status,pdfBase64:t.balance.pdfBase64}:null,returns:t.returns,cases:t.cases,notes:t.notes||[]}))});
function aspBuildItems(){
  const ownRows=ASPST.filter(r=>r.own&&String(r.at||'').slice(0,10)===TODAY);
  const items=[{own:true,name:'Saját adatom',tax:'',doneToday:ownRows.length>0,summary:ownRows.length?`${ownRows.length} önkormányzat · ma lekérdezve`:''}];
  const act=CLIENTS.filter(c=>c.via!=='own'&&c.active&&(!c.auth||c.auth>=TODAY)).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'hu'));
  for(const c of act){
    const cr=ASPST.filter(r=>!r.own&&r.c===c.id&&String(r.at||'').slice(0,10)===TODAY);
    items.push({own:false,name:c.name,tax:c.tax||'',doneToday:cr.length>0,summary:cr.length?`${cr.length} önkormányzat · ma lekérdezve`:''});
  }
  return items;
}
async function aspOwnStep(p,{daily=true}={}){
  const D=ASPDESK();if(!D||!D.readOwnAuto)return{skip:true};
  if(!p||!p.mine||p.authMode!=='totp'||!sysOn(p,'tarhely_personal')||p.subjectScope==='business')return{skip:true};
  if(daily&&ASPST.some(r=>r.own&&String(r.at||'').slice(0,10)===TODAY))return{skip:'Önkormányzati portál (saját): ma már kiolvasva'};
  const r=await D.readOwnAuto(p.vaultKey);
  if(!r||!r.ok)return(r&&(r.ineligible||r.blocked||r.busy))?{skip:true}:{error:String((r&&r.error)||'nem érhető el')};

async function resolveSubject(id,action){

    body.authorized=true;body.name=n?n.value.trim():'';

  await run(()=>api('POST',`discovered-subjects/${id}`,body),{create:'Ügyfél felvéve, a levelei átkerültek hozzá',self:'Megjelölve sajátodként – többé nem ajánljuk fel',ignore:'Kihagyva'}[action]);

}

async function mcpSyncTick(){

  let req=null;try{req=(await api('GET','desktop/mcp-sync/next')).request}catch(e){return}
  if(!req)return;
  const id=req.id,fin=(ok,note)=>api('POST','desktop/mcp-sync/'+id+'/finish',{ok,note:mcpNote(note)}).catch(()=>{});
  const why=trialBlocked()?'A próbaidő lejárt, ezért a szinkron nem indítható.':!OFFICE.live_listing?'Az élő listázás ki van kapcsolva az irodában.':!schedPortals().length?'Nincs futtatható belépő (az ütemezésből minden belépő ki van hagyva, vagy nincs mentett belépő).':null;
  if(why){try{await api('POST','desktop/mcp-sync/'+id+'/start')}catch(e){return}await fin(false,why);return}
  try{
    const b=await D.begin(id);if(!b||!b.ok)return;

    if(!schedPortals().length){await api('POST','desktop/mcp-sync/'+id+'/start').catch(()=>{});await fin(false,'Nincs futtatható belépő (az ütemezésből minden belépő ki van hagyva).');return}
    const st=await api('POST','desktop/mcp-sync/'+id+'/start');if(!st||!st.ok)return;
    await runAutoAll('mcp');

  }catch(e){await fin(false,e&&e.message||'Hiba')}
  finally{try{await D.end(id)}catch(e){}}
}

function initTablesState(){
  if(!S.tables)S.tables={tab:'returns',subtab:'missing',q:'',client:'',year:(new Date()).getFullYear(),status:'',sortCol:'',sortDir:'asc',page:1,pageSize:50,loading:false,data:null,expOpen:false};
  return S.tables;
}

function getActiveTableView(){
  const t=initTablesState().tab||'returns';
  if(t==='returns')return S.tables.subtab==='all'?'returns':'missing_returns';
  if(t==='efo')return S.tables.subtab==='quotas'?'efo_quotas':'efo_declarations';
  return t;
}

let TABLES_TIMER=null;
function refreshTablesData(){
  if(S.area!=='tables')return;
  if(TABLES_TIMER)clearTimeout(TABLES_TIMER);
  TABLES_TIMER=setTimeout(()=>{fetchTaxTables()},180);
}

async function fetchTaxTables(){
  if(typeof api!=='function')return;
  const t=initTablesState(),v=getActiveTableView();
  t.loading=true;
  const p=new URLSearchParams();
  p.set('view',v);
  p.set('page',t.page);
  p.set('per_page',t.pageSize);
  if(t.q)p.set('search',t.q);
  if(t.client)p.set('client_id',t.client);
  if(t.year)p.set('year',t.year);
  if(t.status)p.set('status',t.status);
  if(t.sortCol)p.set('sort_by',t.sortCol);
  if(t.sortDir)p.set('sort_dir',t.sortDir);
  try{
    const res=await api('GET','taxpayer-tables/data?'+p.toString());
    t.data=res;
    t.loading=false;
  }catch(e){
    t.loading=false;
    if(!t.data)t.data={items:[],total:0,page:1,per_page:t.pageSize,years:[],clients:[],sync_supported:TAX_TABLE_VIEWS[v]?.syncSupported!==false};
  }
  const activeEl=typeof document!=='undefined'?document.activeElement:null;
  const keepQ=activeEl&&activeEl.id==='tableq',selS=keepQ?activeEl.selectionStart:null,selE=keepQ?activeEl.selectionEnd:null;
  if(typeof renderDetail==='function')renderDetail();
  if(keepQ&&typeof document!=='undefined'){
    const n=document.getElementById('tableq');
    if(n){n.focus({preventScroll:true});if(selS!=null)try{n.setSelectionRange(selS,selE)}catch(e){}}
  }
}

function downloadTaxTablesExport(fmt){
  const v=getActiveTableView(),t=S.tables||{};
  const p=new URLSearchParams();
  p.set('view',v);
  p.set('format',fmt);
  if(t.q)p.set('search',t.q);
  if(t.client)p.set('client_id',t.client);
  if(t.year)p.set('year',t.year);
  if(t.status)p.set('status',t.status);
  if(t.sortCol)p.set('sort_by',t.sortCol);
  if(t.sortDir)p.set('sort_dir',t.sortDir);
  const a=document.createElement('a');
  a.href='/api/taxpayer-tables/export?'+p.toString();
  a.download=`${v}-export.${fmt}`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>a.remove(),1000);
}

  missing:{cls:'fic',label:'Hiányzó'},
  unknown:{cls:'na',label:'Ismeretlen'}
};

function openTaxCalendarMonth(cid,monthIdx){
  const t=initTablesState();
  const rows=(t.data&&t.data.items)||[];
  const row=rows.find(x=>String(x.client_id)===String(cid));
  if(!row)return;
  const m=row.months&&(row.months[monthIdx]||row.months[String(monthIdx)]);
  const list=(m&&m.items)||[];
  if(!list.length)return;
  const mName=(CAL_MONTH_NAMES[monthIdx-1]||'').toLowerCase();
  const trs=list.map(it=>{
    const meta=CAL_ST_META[it.status]||CAL_ST_META.unknown;
    const kindTxt=it.kind&&it.kind!=='ALAPBEVALLAS'?` <span class="mut">(${esc(ttReturnKindLabel(it.kind))})</span>`:'';
    const dtTxt=it.submitted_at?`Beadva: <span class="mono">${esc(it.submitted_at)}</span>`:(it.due_date?`Esedékes: <span class="mono">${esc(it.due_date)}</span>`:'<span class="mut">–</span>');
    return `<tr>
      <td class="mono"><b>${esc(it.form_code||'–')}</b></td>
      <td>${esc(it.title||'–')}${kindTxt}</td>
      <td class="mono">${esc(it.period||'–')}</td>
      <td>${dtTxt}</td>
      <td><span class="st ${meta.cls}">${meta.label}</span></td>
    </tr>`;
  }).join('');
  simpleDlg(`<h3>${esc(row.client_name)} — ${t.year}. ${esc(mName)}</h3>
    ${row.client_tax?`<p class="mut mono" style="margin:-4px 0 12px">${esc(row.client_tax)}</p>`:''}
    ${tblw(`<table class="tbl"><thead><tr><th>Bevallás</th><th>Megnevezés</th><th>Időszak</th><th>Dátum</th><th>Állapot</th></tr></thead><tbody>${trs}</tbody></table>`)}

      <button type="button" class="btn ghost" data-tables-jump-returns="${esc(row.client_id)}">Megnyitás a Bevallások fülön</button>
      <form method="dialog" style="margin:0"><button class="btn">Bezárás</button></form>
    </div>`,true);
}

// ES3-megnyitó: helyi akta megtekintése. A szerver kibontja és visszaadja; semmit nem archivál.
const fmtXml=x=>{let d=0;return x.trim().replace(/>\s*</g,'>\n<').split('\n').map(l=>{if(/^<\//.test(l))d=Math.max(d-1,0);const o='  '.repeat(d)+l;if(/^<[^!?\/]([^>]*[^\/])?>$/.test(l))d++;return o}).join('\n')};
// szöveg dekódolása a fájl saját kódolásával (XML-deklaráció vagy HTML meta charset; alapból UTF-8)
function decodeText(u){let h='';for(let i=0;i<Math.min(u.length,2048);i++)h+=String.fromCharCode(u[i]);
  const m=/<\?xml[^>]*encoding=["']([\w.-]+)/i.exec(h)||/<meta[^>]*charset=["']?([\w.-]+)/i.exec(h);
  try{return new TextDecoder(m?m[1]:'utf-8').decode(u)}catch(e){return new TextDecoder('utf-8').decode(u)}}
// XML fa nézet: színezett, becsukható csomópontok. Csak szövegként kerül a lapra (esc), semmi nem fut le belőle.
function xmlTree(text){const doc=new DOMParser().parseFromString(text.replace(/^﻿/,''),'application/xml');if(doc.querySelector('parsererror'))return null;let n=0;
  const nm=e=>`<span class="xt">${esc(e.nodeName)}</span>`,tag=e=>nm(e)+[...e.attributes].map(a=>` <span class="xa">${esc(a.name)}</span>=<span class="xv">"${esc(a.value)}"</span>`).join('');
  const node=x=>{if(++n>20000)throw 0;
    if(x.nodeType===1){const kids=[...x.childNodes].filter(c=>c.nodeType!==3||c.nodeValue.trim());
      if(!kids.length)return `<div class="xl">&lt;${tag(x)}/&gt;</div>`;
      if(kids.length===1&&(kids[0].nodeType===3||kids[0].nodeType===4))return `<div class="xl">&lt;${tag(x)}&gt;<span class="xx">${esc(kids[0].nodeValue.trim())}</span>&lt;/${nm(x)}&gt;</div>`;
      return `<details open><summary>&lt;${tag(x)}&gt;<span class="xc"> … ${kids.length} elem &lt;/${esc(x.nodeName)}&gt;</span></summary><div class="xk">${kids.map(node).join('')}</div><div class="xl">&lt;/${nm(x)}&gt;</div></details>`}
    if(x.nodeType===3||x.nodeType===4)return `<div class="xl"><span class="xx">${esc(x.nodeValue.trim())}</span></div>`;
    if(x.nodeType===8)return `<div class="xl xm">&lt;!--${esc(x.nodeValue)}--&gt;</div>`;

  if(!ts.ok){await fetch('/api/settings/smtp',{method:'DELETE',credentials:'same-origin',headers:{'Accept':'application/json','X-XSRF-TOKEN':XSRF()}}).catch(()=>{});
    console.warn('SMTP-próba:',ts.j.message);return 'A tesztlevél nem ment ki: '+onbSmtpWhy(ts.j.message)}

function updRender(){
  const el=document.getElementById('updbanner');if(!el)return;
  const p=UPD.progress;
  if(p&&p.phase&&p.version){
    const v=esc(p.version);
    let body='<span class="upd-ico" aria-hidden="true"></span>';
    if(p.phase==='downloading'){
      const pct=typeof p.percent==='number'&&Number.isFinite(p.percent)?Math.min(100,Math.max(0,Math.round(p.percent))):null;
      body+=`<span class="upd-txt">A KapuMail ${v} letöltése…</span>${pct!==null?`<span class="upd-pct">${pct}%</span>`:''}<span class="upd-prog${pct===null?' is-indet':''}" role="progressbar" aria-label="Letöltés állapota" aria-valuemin="0" aria-valuemax="100"${pct!==null?` aria-valuenow="${pct}" style="--upd-pct:${pct}%"`:''}><span class="upd-fill"></span></span>`;
    }else if(p.phase==='verifying'){
      body+=`<span class="upd-txt">A KapuMail ${v} kódaláírásának ellenőrzése…</span><span class="upd-prog is-indet" aria-hidden="true"><span class="upd-fill"></span></span>`;
    }else if(p.phase==='ready'){
      const inst=p.mode==='installer';
      body+=`<span class="upd-txt">Kész a KapuMail ${v}.</span><span class="upd-detail">${inst?'A telepítő ellenőrizve lett – indításkor a KapuMail bezárul.':'Kilépéskor települ, vagy most rögtön egy újraindítással.'}</span><span class="upd-acts"><button type="button" class="upd-btn pri" data-updrestart>${inst?'Telepítés most':'Újraindítás most'}</button><button type="button" class="upd-btn sec" data-upddismiss>Később</button></span>`;
    }else if(p.phase==='failed'){
      body+=`<span class="upd-txt">A frissítés nem fejeződött be.</span><span class="upd-acts"><button type="button" class="upd-btn pri" data-updgo>Újrapróbálás</button><button type="button" class="upd-btn sec" data-upddismiss>Később</button></span>`;
    }else{
      body+=`<span class="upd-txt">Újraindulás a KapuMail ${v} verzióval…</span>`;
    }
    el.dataset.phase=p.phase;el.innerHTML=body;el.hidden=false;UPD.shownKey=null;updRelayout();return;
  }

  if(!st||!st.available||!lat||updIsSnoozed(lat.version)){
    el.hidden=true;delete el.dataset.phase;el.innerHTML='';UPD.shownKey=null;updRelayout();return;
  }
  const renew=!!(OFFICE.license&&OFFICE.license.officialBuild&&!OFFICE.license.canSync);

  const pri=renew?`<button type="button" class="upd-btn pri" data-trialmodal>Előfizetés aktiválása</button>`:`<button type="button" class="upd-btn pri" data-updgo>${st.canInstall?'Frissítés':'Letöltés'}</button>`;
  el.innerHTML=`<span class="upd-txt">${renew?`Elérhető a KapuMail ${v} – a frissítéshez aktív előfizetés szükséges.`:`Elérhető a KapuMail ${v}.`}</span>${notes}<span class="upd-acts">${pri}<button type="button" class="upd-btn sec" data-updlater="${v}">Később</button></span>`;

}
function updWhenTxt(iso){
  if(!iso)return '';
  const d=new Date(iso);if(isNaN(d))return '';
  const mins=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
  if(mins<1)return 'épp most';
  if(mins<60)return `${mins} perce`;
  const hrs=Math.round(mins/60);
  if(hrs<24)return `${hrs} órája`;
  return iso.slice(0,16).replace('T',' ');
}

   <label class="task"><input type="checkbox" data-mcp-on ${d.enabled?'checked':''}><span>AI-kapcsolat engedélyezése<small>Kikapcsolva minden token és OAuth-kapcsolat elutasításra kerül; bekapcsoláskor újra élnek.</small></span></label>
   ${MCPV.tok?`<div style="margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--amber-bg);color:var(--amber)"><b>Az új token – csak most látszik, másold el:</b>${box(MCPV.tok,'Token másolása')}<span style="font-size:12.5px">Az alábbi beállításokba már be van írva. Ha elveszik, vond vissza és készíts újat.</span></div>`:''}

   <h4 class="sub" style="margin-top:16px">OAuth-kapcsolatok (ChatGPT, claude.ai)</h4>

document.addEventListener('change',async e=>{const t=e.target;if(!t||!t.dataset)return;
  if('mcpOn' in t.dataset){try{await api('POST','settings/mcp',{enabled:t.checked});toast(t.checked?'AI-kapcsolat bekapcsolva':'AI-kapcsolat kikapcsolva')}catch(_){t.checked=!t.checked}return}
  if('mcpGrant' in t.dataset){try{await api('POST','mcp/grants/'+t.dataset.mcpGrant,{level:t.value});toast('Szint: '+MCPL[t.value])}catch(_){}renderMcp()}
  if('mcpToken' in t.dataset){try{await api('POST','mcp/tokens/'+t.dataset.mcpToken,{level:t.value});toast('Szint: '+MCPL[t.value]+' – a kliensben nem kell semmit átírni')}catch(_){}renderMcp()}
  if('mcpRelay' in t.dataset){const RB=window.iratkapuDesktop&&window.iratkapuDesktop.relay;if(!RB)return;try{await RB.set(t.checked);toast(t.checked?'Közvetítő bekapcsolva':'Közvetítő kikapcsolva')}catch(x){toast(esc(x.message||'Nem sikerült'),true)}
    if(!t.checked)MCPV.pair=null;renderMcp();if(t.checked)setTimeout(renderMcp,2000)}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset||!('mcpPair' in f.dataset))return;e.preventDefault();const b=f.querySelector('button');b.disabled=true;
  try{const r=await api('POST','mcp/pairing',{level:f.level.value});MCPV.pair={code:r.code,expires_at:r.expires_at,level:f.level.value};toast('Csatlakozási kód kész')}catch(_){}b.disabled=false;renderMcp()});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset||!('mcpNew' in f.dataset))return;e.preventDefault();const b=f.querySelector('button');b.disabled=true;
  try{const r=await api('POST','mcp/tokens',{name:f.name.value,user:f.user.value,level:f.level.value,days:f.days.value?+f.days.value:null});MCPV.tok=r.token;toast('Token létrehozva – másold el most')}catch(_){}b.disabled=false;renderMcp()});
document.addEventListener('click',async e=>{

  const rv=e.target.closest('[data-mcp-revoke]');if(rv){if(!confirm(`Visszavonod a(z) „${rv.dataset.name}” tokent? Az ezt használó AI-kliens azonnal elveszti a hozzáférést.`))return;try{await api('DELETE','mcp/tokens/'+rv.dataset.mcpRevoke);MCPV.tok=null;toast('Token visszavonva')}catch(_){}renderMcp();return}
  const gd=e.target.closest('[data-mcp-grant-del]');if(gd){if(!confirm('Visszavonod ezt az OAuth-kapcsolatot? A kliens azonnal elveszti a hozzáférést; újra csatlakozni csak új engedélyezéssel tud.'))return;try{await api('DELETE','mcp/grants/'+gd.dataset.mcpGrantDel);toast('Kapcsolat visszavonva')}catch(_){}renderMcp()}});
// ---- újrahitelesítés: egy adott tárhely újrakötése felugró ablakban ----
// Élő postafiókhoz rendelt tárhelynél (asztali app) valódi belépés a hivatalos oldalon, utána listázás;
// demó tárhelynél a lépések szimuláltak, és ezt az ablak ki is írja.
const RA={id:null,mode:'totp',phase:'pick',step:0,msg:'',err:'',timer:null,real:false};
const raBox=()=>SYNCS.find(x=>x.id===RA.id),raLive=()=>window.iratkapuDesktop&&window.iratkapuDesktop.live;
function raStop(){clearInterval(RA.timer);clearTimeout(RA.timer);RA.timer=null}
function reauthOpen(id){raStop();const b=SYNCS.find(x=>x.id===id);if(!b)return;Object.assign(RA,{id,phase:'pick',step:0,msg:'',err:'',real:!!(raLive()&&b.live)});renderReauth()}
function renderReauth(){const dl=$('#dlg'),b=raBox();if(!b)return;const m=CONN_MODES.find(x=>x[0]===RA.mode),demo=OFFICE.mode==='demo',can=RA.real||demo,SL=['Függőben','Belépés','Megerősítés','Listázás','Kész'];
  dl.classList.remove('wide');dl.onclose=()=>{const run=RA.phase==='run';raStop();if(run&&RA.real)raLive().close();RA.phase='pick';render()};
  let h=`<div class="dlg"><h3>Tárhely újrahitelesítése</h3>
    <div class="rabox ${RA.phase==='done'?'ok':''}">${ic(RA.phase==='done'?'check':'alert')}<div><b>${esc(b.c.name)} · ${BOXN[b.b]||b.b}</b><small>${esc(b.note)} · utolsó sikeres szinkron: ${esc(b.at)}</small></div></div>`;
  if(RA.phase==='pick')h+=`<p>A tárhely hitelesítése lejárt, ezért a listázás leállt: amíg nem lépsz be újra, az új iratok nem jelennek meg. ${RA.real?'A belépés a hivatalos azonosítási oldalon történik, külön ablakban: a KapuMail a jelszavadat és a kódjaidat nem kéri be, nem látja és nem tárolja.':''}</p>
    ${can?`<div class="form">${CONN_MODES.map((x,i)=>`<label class="opt"><input type="radio" name="ramode" value="${x[0]}" ${RA.mode===x[0]?'checked':''}><span><b>${x[1]}</b>${i?'':' <span class="st ok" style="margin-left:6px">Ajánlott</span>'}<small>${x[2]}</small></span></label>`).join('')}</div>`:''}
    ${RA.real?'':demo?`<p class="mut" style="margin:12px 0 0">Demó tárhely: valódi belépés nem történik, a lépéseket az alkalmazás szimulálja.</p>`
      :`<div class="cbanner" style="margin:0"><div class="warn" style="margin:0">${ic('alert')}<span>${raLive()?'Ez a tárhely nincs élő postafiókhoz rendelve. Indíts szinkront a hozzá tartozó Ügyfélkapu-kapcsolaton az Ügyfelek nézetben. Ha a postafiók nem rendelődik hozzá magától, a szinkron végén kézzel megadhatod.':'Az újrahitelesítés csak az asztali alkalmazásban érhető el, mert a belépés a te gépeden, a hivatalos oldalon történik.'}</span></div></div>`}
    <div class="acts" style="margin-top:16px"><button class="btn ghost" data-rax>Mégsem</button>${can?`<button class="btn" data-rago>${ic('shield')}Belépés indítása</button>`:raLive()?`<button class="btn" data-ngo="clients">Ügyfelek megnyitása</button>`:''}</div>`;
  else h+=`<div class="wprog"><ol class="wsteps" aria-label="Lépések">${SL.map((l,i)=>`<li class="${RA.phase==='fail'?'':RA.phase==='done'||i<RA.step?'done':i===RA.step?'now':''}">${l}</li>`).join('')}</ol></div>
    <p><b>${esc(m[1])}</b></p>
    ${RA.phase==='fail'?`<div class="cbanner" style="margin:0"><div class="warn" style="margin:0;background:var(--red-bg);color:var(--red)">${ic('alert')}<span>${esc(RA.err||'Az újrahitelesítés nem sikerült.')}</span></div></div>`
      :RA.phase==='done'?`<p>${ic('check')} ${RA.msg}</p>`
      :RA.step===2&&RA.real?`<p>${m[3]}</p><p class="mut">Ha nem látod az ablakot, keresd a „Belépés a hivatalos oldalon” című ablakot.</p>`
      :`<p>${['Előkészítés…',RA.real?'A hivatalos oldal betöltése folyamatban…':'Belépés (szimulált)…',RA.real?m[3]:'Megerősítés (szimulált)…','Belépés rendben. Az új iratok listázása folyamatban…',''][RA.step]}</p>`}
    <div class="acts" style="margin-top:16px">${RA.phase==='fail'?'<button class="btn ghost" data-rax>Bezárás</button><button class="btn" data-rare>Újra</button>':RA.phase==='done'?'<button class="btn" data-rax>Kész</button>':'<button class="btn ghost" data-rax>Megszakítás</button>'}</div>`;
  dl.innerHTML=h+'</div>';if(!dl.open)dl.showModal()}
const raFail=e=>{raStop();RA.phase='fail';RA.err=e;if($('#dlg').open)renderReauth()};
async function raFinish(){RA.step=3;renderReauth();const id=RA.id;
  try{if(RA.real){const D=raLive(),rb=SYNCS.find(s=>s.id===id),rp=rb&&PORTALS.find(p=>p.id===rb.portalId),r=await D.list(null,rp?mailboxFilterFor(rp):null,{sent:!!OFFICE.live_sent});if(!r.ok)return raFail((r.error||'A listázás nem sikerült.')+(r.hint?' '+r.hint:''));
      const x=await ingestLive(r.letters,{mailboxes:mbMeta(r.mailboxes),portalId:rp?rp.id:undefined});await load();const b=SYNCS.find(s=>s.id===id);
      if(!b||b.st==='need')return raFail(x.reason||'A belépés sikerült, de ehhez a tárhelyhez nem érkezett lista. Ellenőrizd a Beállításokban, hogy a megfelelő élő postafiókhoz van-e rendelve.');
      RA.msg=`Sikeres újrahitelesítés. ${x.created} új küldemény került a listára${x.known?`, ${x.known} már ismert volt`:''}.`}
    else{await api('POST',`mailboxes/${id}/reauth`);await load();RA.msg='Újrahitelesítve (demó). A listázás lefutott, a tárhely újra naprakész.'}

async function refreshPortalCodes(){

async function savePortalForm(startSync){
  const f=document.getElementById('pform');if(!f)return;
  const pid=f.dataset.pid?+f.dataset.pid:null;
  const name=$('#pname').value.trim(),notifyEmail=$('#pemail').value.trim()||null,notes=$('#pnotes').value.trim()||null;
  const authMode=(document.querySelector('input[name=pmode]:checked')||{}).value||'totp';
  const dlActive=$('#pdlactive').checked,autoCreate=$('#pautocreate')?$('#pautocreate').checked:true;
  const systems=[...document.querySelectorAll('#pform [data-psys]')].filter(x=>x.checked).map(x=>x.dataset.psys);
  if(document.querySelector('#pform [data-psys]')&&!systems.length){toast('Legalább egy rendszert engedélyezz, különben a belépő semmire nem használható',true);return}
  if(!name){toast('Add meg a kapcsolat megnevezését',true);$('#pname').focus();return}
  const P=window.iratkapuDesktop&&window.iratkapuDesktop.portal;
  const username=($('#puser')?.value||'').trim(),password=$('#ppass')?.value||'',totpSeed=($('#pseed')?.value||'').trim();
  if(P&&authMode==='totp'&&totpSeed){
    const chk=await P.totpPreview(totpSeed);
    if(!chk.ok){toast(esc(chk.error),true);$('#pseed')?.focus();return}
  }
  let res;
  try{res=await api('POST','portals',{id:pid,name,notes,notifyEmail,authMode,dlActive,autoCreate,systems:document.querySelector('#pform [data-psys]')?systems:undefined,selfIds:$('#pself')?$('#pself').value:undefined,subjectScope:$('#pscope')?$('#pscope').value:undefined})}catch(e){return}
  if(P&&authMode==='totp'&&$('#preuse')&&$('#preuse').checked&&$('#preusekey')){
    const cp=await P.copyCreds($('#preusekey').value,res.vaultKey);
    if(!cp.ok){toast(esc(cp.error||'Az elmentett belépő átvétele nem sikerült'),true);return}
  }
  if(P&&authMode==='totp'&&(username||password||totpSeed)){
    const sc=await P.saveCreds(res.vaultKey,{mode:authMode,username,password,totpSeed});
    if(!sc.ok){toast(esc(sc.error||'A titoktár mentése nem sikerült'),true);return}
  }
  await load();
  // Automata módban hiányzó belépési adatokkal a hivatalos belépőablak nyílna meg, magyarázat nélkül. Előbb megkérdezzük.
  if(startSync&&P&&authMode==='totp'){
    let ci={};try{ci=await P.credInfo(res.vaultKey)}catch(e){}
    if(!(ci.hasCreds&&ci.hasTotp)&&!confirm('Nem adtál meg minden belépési adatot (felhasználónév, jelszó, hitelesítő kulcs), ezért a KapuMail nem tud magától belépni.\n\nMegnyissam a hivatalos Ügyfélkapu-belépőablakot, hogy ott kézzel lépj be?\n\nA „Mégse” gombbal a kapcsolat elmentve marad, és az adatokat később is megadhatod a Beállítások → Belépők és rendszerek lapon.')){$('#dlg').close();toast('Ügyfélkapu-kapcsolat elmentve – a belépési adatok még hiányoznak');return}
  }
  if(startSync){runPortalSync(res.id)}
  else{$('#dlg').close();toast('Ügyfélkapu-kapcsolat elmentve')}
}

// ---- Teljes portál-szinkron: KAÜ belépés (automata TOTP vagy DÁP/e-mail) -> Tárhely + automata letöltések -> NAV ügyfélportál ----
const PSTEPS=['Belépés (KAÜ)','Megerősítés','Tárhely és letöltések','NAV adónaptár','Kész'];
const UPO_MAX=240000; // ennyit várunk a NAV ügyfélportál olvasására (belépés a következő kódablakban + lapozott listák), utána megyünk tovább
/*NAVSTEP*/
// NAV ügyfélportál olvasása böngésző nélkül, a belépő tárolt adataival (ADR-010, „A kör”): csak GET, a belépő saját nevében.
// Kiolvassa a pillanatképet, a képviselt adózók listáját és – tételesen – az adónaptárat meg a hiányzó bevallásokat, és
// beküldi a szervernek. Visszaad: {ok,text} | {skip:szöveg} (nem hiba, a szinkron megy tovább) | {error:szöveg}.
// Ez a lépés a belépőt SOHA nem állítja „újrakapcsolás kell” állapotba: amit itt nem lehet elolvasni, azon az ablakos
// újrakapcsolás nem segít.
// C kör: egy beadott bevallás a szervernek szánt alakban
// C kör: egy NAV-dokumentum a szervernek szánt alakban
const navDoc=x=>({barcode:x.barcode||null,regNo:x.regNo||null,subject:x.subject||null,docType:x.docType||null,formCode:x.formCode||null,formName:x.formName||null,caseType:x.caseType||null,caseNo:x.caseNo||null,krNo:x.krNo||null,submittedAt:x.submittedAt||null,arrivedAt:x.arrivedAt||null,downloadedAt:x.downloadedAt||null,files:x.files||0});
const navRet=x=>({regNo:x.regNo,formCode:x.formCode,title:x.title||null,periodStart:x.periodStart||null,periodEnd:x.periodEnd||null,submittedAt:x.submittedAt||null,state:x.state||null,kind:x.kind||null});
// Új / változott / változatlan sorok összesítése a saját és az ügyfelenkénti NAV-lekérdezésből; null, ha a szerver nem adta meg.
function navTally(...ts){const t=ts.filter(Boolean);if(!t.length)return null;return t.reduce((a,x)=>({new:a.new+(x.new||0),changed:a.changed+(x.changed||0),same:a.same+(x.same||0)}),{new:0,changed:0,same:0})}
function navTallyText(t,noun,changedWord){
  const p=[];
  p.push(t.new?`<b>${t.new} új ${noun}</b>`:`Nincs új ${noun}`);
  if(t.changed)p.push(`<b>${t.changed}</b> ${changedWord}`);
  if(t.same)p.push(`<span class="mut">${t.same} változatlan</span>`);
  return p.join(' · ');
}
async function navPortalStep(p,{daily=true,onStep=null}={}){
  const NV=window.iratkapuDesktop&&window.iratkapuDesktop.nav;
  const idle=()=>api('POST',`portals/${p.id}/status`,{upoState:'idle'}).catch(()=>{});
  const emit=(step,pct,text)=>{if(onStep)try{onStep({step,pct,text})}catch(_){}};
  if(!sysOn(p,'upo'))return{skip:'NAV ügyfélportál kikapcsolva ennél a belépőnél'};
  if(!NV)return{skip:'NAV ügyfélportál kihagyva: az olvasásához frissebb asztali alkalmazás kell'};
  if(!p.mine){await idle();return{skip:'NAV ügyfélportál kihagyva: a NAV-adatokat csak a belépő gazdája olvashatja ki a saját gépén'}}
  if(p.authMode!=='totp'){await idle();return{skip:'NAV ügyfélportál kihagyva: csak kódos (Ügyfélkapu+) belépővel, elmentett belépési adatokkal olvasható'}}
  if(daily&&p.nav&&String(p.nav.at||'').slice(0,10)===TODAY)return{skip:'NAV ügyfélportál: ma már kiolvasva, naponta egyszer olvassuk'};
  // B kör: képviselet-váltás az ügyfelek adataihoz – csak ha a tulajdonos bekapcsolta; a szerver mondja meg, kikre.
  let tg=[];if(OFFICE.nav_switch){emit(0,4,'Képviselt adózók célpontjainak lekérése…');try{tg=((await api('GET','nav/targets?portalId='+p.id+(daily?'':'&force=1')))||{}).ids||[]}catch(x){if(x.message==='auth')throw x}}
  if(onStep&&typeof NV.onProgress==='function')NV.onProgress(ev=>{if(!ev||(ev.key&&ev.key!==p.vaultKey))return;emit(0,typeof ev.pct==='number'?ev.pct:null,ev.text||'')});
  let nv;
  try{nv=await NV.readOwn(p.vaultKey,tg,!!OFFICE.nav_queries)}
  finally{if(onStep&&typeof NV.onProgress==='function')NV.onProgress(null)}
  if(!nv||!nv.ok){
    await idle();
    if(nv&&nv.ineligible)return{skip:'NAV ügyfélportál kihagyva: ehhez a belépőhöz nincs elmentve a jelszó és a kódgeneráló kulcs'};
    if(nv&&nv.blocked)return{skip:'NAV ügyfélportál kihagyva: a belépő hibás jelszó miatt tiltva van'};
    return{error:String((nv&&nv.error)||'ismeretlen ok')};
  }
  const ci=nv.calendarInfo||{},sub=nv.subject||null;let nr;
  emit(1,92,'NAV-adatok mentése és párosítása a tárhelyes nyugtákkal…');
  try{nr=await api('POST','nav/ingest',{portalId:p.id,user:{taxId:(nv.user||{}).taxId||null},profiles:(nv.profiles||[]).map(x=>({name:x.name,stem:x.stem,taxId:x.taxId})),account:nv.account||null,
    missingCount:nv.missingCount,futureCount:nv.futureCount,calendarCount:nv.calendarCount,
    subject:sub?{stem:sub.stem||null,taxId:sub.taxId||null,own:!!sub.own}:null,
    obligations:(nv.obligations||[]).map(o=>({formCode:o.formCode,title:o.title||null,dueDate:o.dueDate,periodStart:o.periodStart||null,periodEnd:o.periodEnd||null,status:o.status||null,...(o.conditional?{conditional:true}:{})})),
    ...(Array.isArray(nv.returns)?{returns:nv.returns.map(navRet)}:{}),...(Array.isArray(nv.documents)?{documents:nv.documents.map(navDoc)}:{}),
    ...(nv.taxpayerTables?{taxpayerTables:nv.taxpayerTables}:{})})}
  catch(x){if(x.message==='auth')throw x;return{error:'a NAV-adatokat a szerver nem fogadta be'}}
  const cal=nr.calendar||null,dropped=(ci.unknown||0)+(ci.missingUnknown||0),rows=[];
  let text=`NAV-portál kiolvasva – ${nr.total} képviselt adózó`+(nr.suggested?`, <b>${nr.suggested} ajánlott ügyfél</b>`:'');
  rows.push({k:'NAV képviseletek',v:`<b>${nr.total}</b> képviselt adózó`+(nr.suggested?` <button type="button" class="syncpill" data-sjopen>${nr.suggested} ajánlott ügyfél</button>`:'')});
  if(cal&&cal.matched){
    text+=`, ${cal.upserted||0} adónaptár-tétel frissítve`+(cal.paired?`, ${cal.paired} nyugtával összepárosítva`:'');
    rows.push({k:'Saját adónaptár',v:(cal.upserted?`<b>${cal.upserted} tétel</b> aktualizálva`:`Nincs változás <span class="mut">· 0 módosult tétel</span>`)+(cal.paired?` · ${cal.paired} nyugtával párosítva`:'')+(sub&&!sub.own&&cal.upserted?` <span class="mut">(${esc(sub.name||sub.stem||sub.taxId||'')})</span>`:'')+(dropped?` <span class="mut">· ${dropped} ismeretlen alakú kihagyva</span>`:'')});
  }else if(cal&&cal.received){
    text+=cal.reason==='inactive'?', az adónaptár kihagyva: a NAV-nál kiválasztott adózó inaktív vagy lejárt meghatalmazású ügyfél':', az adónaptár kihagyva: a NAV-nál kiválasztott adózó nem ügyfél';
    rows.push({k:'Saját adónaptár',v:cal.reason==='inactive'?'Kihagyva <span class="mut">· a kiválasztott adózó inaktív vagy lejárt meghatalmazású</span>':'Kihagyva <span class="mut">· a kiválasztott adózó nincs felvéve ügyfélként</span>'});
  }
  if(sub&&!sub.own&&cal&&cal.matched&&cal.upserted)text+=` (a NAV-nál kiválasztott adózó: ${esc(sub.name||sub.stem||sub.taxId||'')})`;
  if(dropped)text+=`, ${dropped} tétel ismeretlen alakú, kihagyva`;
  const kc=nv.clients||null;let crRet=0,crDoc=0,crTt=null,crRT=null,crDT=null;
  if(kc){
    emit(1,96,'Ügyfelek adószámlájának és adónaptárának mentése…');
    const good=(kc.clients||[]).filter(c=>c.ok);let cr=null;crRet=0;
    try{cr=await api('POST','nav/ingest-clients',{portalId:p.id,restored:kc.restored!==false,clients:good.map(c=>({stem:c.stem||null,taxId:c.stem?null:(c.taxId||null),account:c.account||null,missingCount:c.missingCount,futureCount:c.futureCount,calendarCount:c.calendarCount,
      obligations:(c.obligations||[]).map(o=>({formCode:o.formCode,title:o.title||null,dueDate:o.dueDate,periodStart:o.periodStart||null,periodEnd:o.periodEnd||null,status:o.status||null,...(o.conditional?{conditional:true}:{})})),
      ...(Array.isArray(c.returns)?{returns:c.returns.map(navRet)}:{}),...(Array.isArray(c.documents)?{documents:c.documents.map(navDoc)}:{}),
      ...(c.taxpayerTables?{taxpayerTables:c.taxpayerTables}:{})}))})}
    catch(x){if(x.message==='auth')throw x}
    if(cr){crRet=cr.returns||0;crDoc=cr.documents||0;crTt=cr.taxpayerTables||null;crRT=cr.returnsTally||null;crDT=cr.documentsTally||null}
    const bad=(kc.clients||[]).length-good.length;
    text+=cr?`; ügyfelenként: <b>${cr.saved} ügyfél adószámlája és adónaptára frissítve</b>`+(cr.skipped?`, ${cr.skipped} kihagyva`:''):'; az ügyfelenkénti adatokat a szerver nem fogadta be';
    if(bad)text+=`, ${bad} adózónál a váltás vagy az olvasás nem sikerült`;
    if(kc.skipped)text+=`, ${kc.skipped} ügyfél a következő futásra marad`;
    if(kc.error)text+=` (megszakadt: ${esc(kc.error)})`;
    if(kc.restored===false)text+=`. <b>Figyelem: a visszaváltás a saját profilodra nem volt igazolható</b> – a NAV-portálon ellenőrizd, kinek a nevében jársz el`;
    rows.push(cr?{k:'Ügyfelek NAV-adatai',v:`<b>${cr.saved} ügyfél</b> adószámlája és adónaptára naprakész`+(cr.skipped?` <span class="mut">· ${cr.skipped} kihagyva</span>`:'')+(bad?` · <span style="color:var(--red)">${bad} adózónál az olvasás nem sikerült</span>`:'')+(kc.skipped?` <span class="mut">· ${kc.skipped} ügyfél a következő futásra maradt</span>`:'')+(kc.error?` <span class="mut">(megszakadt: ${esc(kc.error)})</span>`:'')}:{k:'Ügyfelek NAV-adatai',v:'Az ügyfelenkénti adatokat a szerver nem fogadta be',warn:true});
    if(kc.restored===false)rows.push({k:'Figyelem',v:'<b>A visszaváltás a saját profilodra nem volt igazolható</b> – a NAV-portálon ellenőrizd, kinek a nevében jársz el!',warn:true});

async function downloadLiveMessage(mid){
  const m=M.find(x=>x.id===mid);if(!m||LIVEDL_BUSY)return;
  LIVEDL_BUSY=mid;LIVEDL_NOTE='Engedély kérése…';renderDetail();
  const phase=t=>{LIVEDL_NOTE=t;renderDetail()};
  try{
    const D=window.iratkapuDesktop;
    let res;
    if(D&&D.live&&m.eid&&m.liveBox){
      // Előzetes kérdés a szervernek, még a belépés előtt, hogy tiltott iratnál ne lépjünk be hiába. A döntő engedélyt
      // közvetlenül a letöltés előtt az asztali főfolyamat kéri meg újra: maga a letöltés számíthat átvételnek.
      await api('POST',`messages/${mid}/live-download-check`,{});
      const sy=SYNCS.find(s=>s.live===m.liveBox),own=PORTALS.find(x=>sy&&x.id===sy.portalId);
      // Hitelesítő kulcsos belépőnél böngészőablak nélkül töltünk le (ez az élőben igazolt út); a többinél marad a belépőablak.
      const ci0=(own&&own.authMode==='totp'&&D.auto&&D.auto.downloadManual&&D.portal)?await D.portal.credInfo(own.vaultKey):null;
      if(ci0&&ci0.hasCreds&&ci0.hasPassword&&ci0.hasTotp){
        phase('Letöltés a tárhelyről…');
        const dl=await D.auto.downloadManual(own.vaultKey,{messageId:mid,sent:!!OFFICE.live_sent||isSent(m)});
        if(!dl.ok){if(!dl.cancelled)toast(esc(dl.error||'A tárhelyes letöltés nem sikerült'),true);return} // a Mégse nem hiba
        phase('Kibontás és ellenőrzés…');
        res=await api('POST',`messages/${mid}/live-download`,{fileName:dl.fileName,bytesBase64:dl.bytesBase64});
        await load();select(mid,false,true);
        toast('Irat letöltve, kibontva és ellenőrizve'+(res&&res.enriched&&res.enriched.deadline?` · Kinyert határidő: ${res.enriched.deadline}`:''));
        return;
      }
      let st=await D.live.status();
      // Ha a tárhely kapcsolata ismert, csak annak a munkamenetéből töltünk le.
      if(st.status==='connected'&&own&&!liveOwnedBy(st,own)){await D.live.close();st=await D.live.status()}
      if(st.status!=='connected'){
        const p=own||PORTALS.find(x=>x.authMode==='totp');
        const ci=(p&&D.portal)?await D.portal.credInfo(p.vaultKey):{hasCreds:false};
        if(p&&p.authMode==='totp'&&ci.hasCreds&&ci.hasPassword&&ci.hasTotp){
          toast('Automatikus Ügyfélkapu+ belépés a letöltéshez…');
          const cr=await D.live.connectAuto(p.vaultKey);
          if(!cr.ok)throw new Error(cr.error||'A belépés nem sikerült.');
          for(let w=0;w<35;w++){await sleep(1000);st=await D.live.status();if(st.status==='connected'||st.status==='failed')break}
        }
        if(st.status!=='connected'){toast('A letöltéshez előbb kapcsold össze az Ügyfélkapu / DÁP fiókot!',true);if(p)runPortalSync(p.id);return}
      }
      let dl=await D.live.downloadOne({messageId:mid});
      if(!dl.ok&&dl.needList){ // a főfolyamat csak azt tölti le, amit ebben a futásban maga listázott: előbb friss lista kell
        const fp=PORTALS.find(x=>sy&&x.id===sy.portalId),lr=await D.live.list(null,fp?mailboxFilterFor(fp):null,{sent:!!OFFICE.live_sent||isSent(m)});
        if(lr.ok)dl=await D.live.downloadOne({messageId:mid});
      }
      if(!dl.ok){if(!dl.cancelled)toast(esc(dl.error||'A tárhelyes letöltés nem sikerült'),true);return}
      res=await api('POST',`messages/${mid}/live-download`,{fileName:dl.fileName,bytesBase64:dl.bytesBase64});
    }else if(OFFICE.mode==='demo'){
      res=await api('POST',`messages/${mid}/live-download`,{demoSimulate:true});
    }else{
      toast('Az élő tárhelyes letöltéshez nyisd meg a KapuMail asztali alkalmazást!',true);return;
    }
    await load();
    select(mid,false,true);
    const dlNote=res&&res.enriched&&res.enriched.deadline?` · Kinyert határidő: ${res.enriched.deadline}`:'';
    toast(`Irat letöltve, kibontva és ellenőrizve${dlNote}`);
  }catch(e){if(e.message!=='auth')console.warn(e.message)}
  finally{LIVEDL_BUSY=null;LIVEDL_NOTE='';renderDetail()}
}

async function upoSyncNow(){
  if(UPO_BUSY)return;
  const D=window.iratkapuDesktop;
  if(!D||!D.nav){await load();if(S.area==='tables')await fetchTaxTables();toast('Az adónaptár frissítve – a NAV ügyfélportál élő olvasása az asztali alkalmazásban fut');return}
  // Azok a belépők, amelyekről a NAV-portál olvasható; ha nincs ilyen, az első belépő adja meg az érthető „kihagyva” okot.
  const fit=PORTALS.filter(x=>x.mine&&sysOn(x,'upo')&&x.authMode==='totp'),list=fit.length?fit:PORTALS.slice(0,1);
  if(!list.length){toast('Előbb adj hozzá egy Ügyfélkapu+ kapcsolatot!',true);return}
  UPO_BUSY=true;render();
  try{
    const out=[];let bad=false;
    for(let pi=0;pi<list.length;pi++){
      const p=list[pi];
      UPOV={who:p.name,step:0,pct:4,idx:pi,tot:list.length,sub:'NAV ügyfélportál: adónaptár és adózói táblák olvasása…',bg:false};renderSyncOv();
      const r=await navPortalStep(p,{daily:false,onStep:s=>{if(!UPOV||!s)return;if(s.step!=null)UPOV.step=s.step;if(typeof s.pct==='number')UPOV.pct=Math.max(UPOV.pct||0,s.pct);if(s.text)UPOV.sub=s.text;renderSyncOv()}});
      if(!r.ok)bad=true;
      out.push((list.length>1?esc(p.name)+': ':'')+(r.ok?r.text:r.skip||`a NAV ügyfélportál olvasása nem sikerült – ${esc(r.error||'ismeretlen ok')}`));
    }
    await load();
    if(S.area==='tables')await fetchTaxTables();
    toast(out.join(' · '),bad);
  }catch(e){}
  finally{UPO_BUSY=false;UPOV=null;renderSyncOv();render()}
}

document.addEventListener('change',e=>{
  if(e.target.name==='pmode'){const b=document.getElementById('ptotpbox');if(b)b.style.display=e.target.value==='totp'?'':'none'}
  if(e.target.id==='pqrfile'&&e.target.files[0]){
    const file=e.target.files[0],P=window.iratkapuDesktop&&window.iratkapuDesktop.portal;
    if(!P){toast('A QR-kód képfelismerés a KapuMail asztali alkalmazásban érhető el – böngészőben másold be a 16 karakteres kulcsot!',true);e.target.value='';return}
    const fr=new FileReader();
    fr.onload=async()=>{
      // A QR-felismerés ebben az ablakban fut (itt biztosan elérhető); a főfolyamat rejtett ablaka csak tartalék,
      // mert ott a felismerő nem minden rendszeren érhető el. A kiolvasott szöveget a főfolyamat értelmezi.
      let r=null;
      if(typeof BarcodeDetector!=='undefined'){
        try{
          const bmp=await createImageBitmap(file);
          const hit=(await new BarcodeDetector({formats:['qr_code']}).detect(bmp))[0];
          if(!hit||!hit.rawValue)r={ok:false,error:'A képen nem található olvasható QR-kód. Próbáld élesebb, közelebbi képpel.'};
          else{const pr=await P.totpPreview(String(hit.rawValue));r=pr.ok?{ok:true,secret:pr.seed,account:pr.account,issuer:pr.issuer}:pr}
        }catch(x){r=null}
      }
      if(!r)r=await P.decodeQr(String(fr.result||''));
      if(!r.ok){toast(esc(r.error||'Nem sikerült QR-kódot olvasni a képből'),true);return}
      const sInp=document.getElementById('pseed');if(sInp)sInp.value=r.secret||r.raw||'';
      // A hitelesítő alkalmazás címkéje nem a belépési név: a kibocsátó előtagját és az „@ugyfelkapu.gov.hu” végződést levesszük,
      // és jelezzük, hogy ellenőrizni kell.
      const uInp=document.getElementById('puser');if(uInp&&!uInp.value&&r.account){uInp.value=String(r.account).replace(/^[^:]*:\s*/,'').replace(/@ugyfelkapu\.gov\.hu$/i,'');toast('A felhasználónevet a QR-kód címkéjéből töltöttem ki – ellenőrizd, hogy ez a belépési neved!')}
      const nInp=document.getElementById('pname');if(nInp&&!nInp.value&&(r.issuer||r.account))nInp.value=[r.issuer,r.account].filter(Boolean).join(' – ');
      updateModalTotpPreview();
      toast('QR-kód beolvasva – az élő 6 jegyű kód már látható!');
    };
    fr.readAsDataURL(file);
    e.target.value='';
  }
});

let tipEl=null;
function placeTipRect(r,w,h,vw,vh,right){
  const pad=8,gap=6,x=Math.max(pad,Math.min(right?r.right-w:r.left,vw-w-pad));
  const below=r.bottom+gap,above=r.top-h-gap;
  const y=below+h<=vh-pad?below:(above>=pad?above:Math.max(pad,Math.min(below,vh-h-pad)));
  return {x:Math.round(x),y:Math.round(y)};
}
function showTip(el){
  const tip=$('#tip'); if(!tip)return;
  const txt=el?.isConnected?el.getAttribute('data-tip'):'';
  if(!txt||!el.getClientRects().length){
    tipEl=null; if(!tip.hidden){tip.hidden=true;tip.textContent='';try{tip.matches?.(':popover-open')&&tip.hidePopover?.()}catch(e){}}
    return;
  }
  tipEl=el; tip.textContent=txt; tip.style.left='0px'; tip.style.top='0px'; tip.hidden=false;
  if(tip.showPopover){try{!tip.matches(':popover-open')&&tip.showPopover()}catch(e){}}
  const p=placeTipRect(el.getBoundingClientRect(),tip.offsetWidth,tip.offsetHeight,innerWidth,innerHeight,el.classList.contains('tipr'));
  tip.style.left=p.x+'px'; tip.style.top=p.y+'px';
}

document.addEventListener('pointerdown',()=>showTip(null));
document.addEventListener('pointerleave',()=>showTip(null));
document.addEventListener('focusin',e=>{const n=e.target.closest?.('[data-tip]');if(n&&e.target.matches?.(':focus-visible'))showTip(n)});
document.addEventListener('focusout',e=>{if(tipEl&&tipEl.contains(e.target))showTip(null)});
document.addEventListener('scroll',()=>showTip(null),true);

  if(b.dataset.area){S.area=b.dataset.area;S.cv=null;$('#app').classList.remove('open');if(innerWidth<760)$('#app').classList.remove('nofold');render();$('#detail').scrollTop=0;return}
  if(b.dataset.fold!==undefined){$('#app').classList.toggle('nofold');return}
  if(b.dataset.help!==undefined){showHelp();return}
  if(b.dataset.folder){S.folder=b.dataset.folder;S.client=null;S.clientSent=false;S.area='inbox';S.checked.clear();if(innerWidth<760)$('#app').classList.remove('nofold');render();return}
  if(b.dataset.client){S.client=b.dataset.client;S.clientSent=false;S.area='inbox';S.checked.clear();if(innerWidth<760)$('#app').classList.remove('nofold');render();return}
  if(b.dataset.csent!==undefined){S.clientSent=!S.clientSent;renderHead();renderRows();return}
  if(b.dataset.seg){S.seg=b.dataset.seg;renderHead();renderRows();return}
  if(b.dataset.rcpt!==undefined){S.hideRcpt=!S.hideRcpt;renderHead();renderRows();return}
  if(b.dataset.hidf!==undefined){S.hidF=!S.hidF;render();return}
  if(b.dataset.dur!==undefined){S.hideDur=!S.hideDur;writeHash();renderHead();renderRows();return}
  if(b.dataset.reauth!==undefined){if(!b.dataset.reauth){toast('Ehhez a tárhelyhez nincs teendő');return}reauthOpen(+b.dataset.reauth);return}
  if(b.dataset.back!==undefined){$('#app').classList.remove('open');document.getElementById(S.sel)?.focus();return}
  if(b.dataset.bulk){const k=b.dataset.bulk,ids=[...S.checked];S.checked.clear();if(k==='x'){renderRows();return}run(()=>api('POST','messages/bulk',{ids,action:k==='read'?'markread':k}),x=>x.skipped?`${x.skipped} irat kimaradt (átvételre vár vagy már kész)`:'Kész');return}
  if(S.tables?.expOpen&&!t.closest('.exp-wrap')){S.tables.expOpen=false;const p=$('#tablesExpPop');if(p)p.hidden=true;const eb=document.querySelector('[data-tables-expmenu]');if(eb)eb.setAttribute('aria-expanded','false')}
  if(b.dataset.tablesExpmenu!==undefined){initTablesState();S.tables.expOpen=!S.tables.expOpen;const p=$('#tablesExpPop');if(p)p.hidden=!S.tables.expOpen;b.setAttribute('aria-expanded',String(!!S.tables.expOpen));return}
  if(b.dataset.tablesExp){const fmt=b.dataset.tablesExp;initTablesState();S.tables.expOpen=false;const p=$('#tablesExpPop');if(p)p.hidden=true;downloadTaxTablesExport(fmt);return}
  if(b.dataset.tablesClear!==undefined){initTablesState();S.tables.q='';S.tables.client='';S.tables.status='';S.tables.page=1;renderDetail();fetchTaxTables();return}
  if(b.dataset.ttab){initTablesState();const tab=b.dataset.ttab;if(S.tables.tab!==tab){S.tables.tab=tab;S.tables.page=1;S.tables.status='';S.tables.sortCol='';S.tables.data=null;renderDetail();fetchTaxTables()}return}
  if(b.dataset.tsubtab){initTablesState();const st=b.dataset.tsubtab;if(S.tables.subtab!==st){S.tables.subtab=st;S.tables.page=1;S.tables.sortCol='';S.tables.data=null;renderDetail();fetchTaxTables()}return}
  if(b.dataset.tablesSort){initTablesState();const col=b.dataset.tablesSort;if(S.tables.sortCol===col){S.tables.sortDir=S.tables.sortDir==='asc'?'desc':'asc'}else{S.tables.sortCol=col;S.tables.sortDir='asc'}S.tables.page=1;fetchTaxTables();return}
  if(b.dataset.tablesPage!==undefined&&!b.disabled){initTablesState();const pg=+b.dataset.tablesPage;if(pg>=1){S.tables.page=pg;fetchTaxTables()}return}
  if(b.dataset.tablesCalcell){const [cid,mi]=b.dataset.tablesCalcell.split(':');openTaxCalendarMonth(cid,+mi);return}
  if(b.dataset.tablesJumpReturns!==undefined){$('#dlg')?.close();initTablesState();S.tables.tab='returns';S.tables.subtab='all';S.tables.client=String(b.dataset.tablesJumpReturns||'');S.tables.page=1;S.tables.sortCol='';S.tables.data=null;renderDetail();fetchTaxTables();return}
  if(b.dataset.tablesStatus!==undefined){initTablesState();S.tables.status=b.dataset.tablesStatus;S.tables.page=1;renderDetail();fetchTaxTables();return}
  const m=M.find(x=>x.id===S.sel);
  if(b.dataset.act&&m){act(m,b.dataset.act);return}
  if(b.dataset.receive!==undefined&&m){askReceive(m);return}
  if(b.dataset.id&&t.closest('[data-takeme]')){const tm=M.find(x=>x.id===b.dataset.id);if(tm)act(tm,'me');return} // a kérdőjeles körre kattintva az irat hozzám kerül, a sor nem nyílik meg
  if(b.dataset.id){ if(t.classList.contains('ck')){t.checked?S.checked.add(b.dataset.id):S.checked.delete(b.dataset.id);renderRows();return} select(b.dataset.id)}
});
document.addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(!r)return;e.preventDefault();S.sel=r.dataset.id;renderRows();renderDetail();openMenu(M.find(x=>x.id===r.dataset.id),e.clientX,e.clientY)});
document.addEventListener('click',e=>{document.querySelectorAll('.stdd[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('.stdd')||!d.open)return;const mn=d.querySelector('.stdd-m'),rr=d.closest('.st-r').getBoundingClientRect(),sr=d.querySelector('summary').getBoundingClientRect();mn.style.right='auto';mn.style.left=Math.max(8,Math.min(sr.left-rr.left,rr.width-mn.offsetWidth-8))+'px'},true);

document.addEventListener('click',e=>{const b=e.target.closest('[data-setint]'),m=M.find(x=>x.id===S.sel);if(!b||!m||b.disabled||b.dataset.setint===m.int)return;run(()=>api('POST',`messages/${m.id}/action`,{action:'status',to:b.dataset.setint}),'Belső állapot módosítva – a hivatalos állapot nem változott')});

  if(t.dataset.tablesPagesize!==undefined){initTablesState();S.tables.pageSize=+t.value||50;S.tables.page=1;fetchTaxTables();return}
  if(t.dataset.task!==undefined){run(()=>api('POST',`tasks/${t.dataset.task}`,{done:t.checked}))}
  if(t.dataset.assign!==undefined&&m){t.value?act(m,'assign',t.value):toast('A felelős nem törölhető, csak átadható',true)}
  if(t.dataset.status!==undefined&&m){run(()=>api('POST',`messages/${m.id}/action`,{action:'status',to:t.value}),'Belső állapot módosítva – a hivatalos állapot nem változott')}
});
document.addEventListener('input',e=>{if(e.target.id==='q'&&S.area==='kapu'){window.KapuView?.onSearch(e.target.value);return}if(e.target.id==='q'){S.q=e.target.value;renderRows();writeHash()}
  if(e.target.id==='tableq'){S.tables.q=e.target.value;S.tables.page=1;refreshTablesData();return}
  if(e.target.id==='cdq'){S.cdq={cid:S.cv,q:e.target.value};const p=e.target.selectionStart;render();const n=$('#cdq');if(n){n.focus();n.setSelectionRange(p,p)}return}
  if(e.target.id==='cq'){S.cq=e.target.value;const p=e.target.selectionStart;renderFolders();const n=$('#cq');n.focus();n.setSelectionRange(p,p)}
