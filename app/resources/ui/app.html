document.addEventListener('submit',e=>{const f=e.target,d=f.dataset,m=M.find(x=>x.id===S.sel),inp=f.querySelector('input'),v=inp&&inp.type!=='file'&&inp.type!=='checkbox'?inp.value.trim():'';
  if(f.method==='dialog')return; e.preventDefault();
  if('addtask' in d&&v)run(()=>api('POST',`messages/${m.id}/tasks`,{title:v}));
  if('addnote' in d&&v)run(()=>api('POST',`messages/${m.id}/notes`,{body:v}));
  if('settype' in d&&v)act(m,'type',v);
  if('setdl' in d&&v)act(m,'deadline',v);
  if(d.cusers)run(()=>api('POST',`clients/${d.cusers}/users`,{users:[...f.querySelectorAll('input:checked')].map(i=>i.value)}),'Kezelők mentve');
  if('replyto' in d){e.preventDefault();const v=f.elements.replyTo.value.trim();run(()=>api('POST','settings',{replyTo:v||null}),v?'Válaszcím mentve: '+esc(v):'Válaszcím törölve');return}
  if('smtp' in d){e.preventDefault();const b=Object.fromEntries(new FormData(f));b.port=+b.port;run(()=>api('POST','settings/smtp',b),'SMTP-beállítás mentve');return}
  if('invite' in d){const g=n=>f.querySelector(`[name=${n}]`).value;run(()=>api('POST','users',{name:g('name'),email:g('email'),role:g('role')}),'Munkatárs felvéve')}
  if('noticeform' in d){const g=n=>f.querySelector(`[name=${n}]`);run(()=>api('POST',`messages/${m.id}/notice`,{contact:+g('contact').value,subject:g('subject').value,body:f.querySelector('.rte').innerText.trim(),html:f.querySelector('.rte').innerHTML,attach:g('attach').checked,again:g('again').checked}),x=>`Elküldve${x.attached?` ${x.attached} csatolmánnyal`:''} (${x.mailer==='log'?'demó: a levél a szerver naplójába került, valódi e-mail nem ment ki':'levelező: '+esc(x.mailer)})`).then(x=>x&&$('#dlg').close())}
  if(d.contact){const g=n=>f.querySelector(`[name=${n}]`).value;run(()=>api('POST',`clients/${d.contact}/contacts`,{name:g('name'),email:g('email'),role:g('role')}),'Értesítési cím felvéve')}
  if('viewform' in d){const sh=f.querySelector('input[type=checkbox]').checked;run(()=>api('POST','views',{name:v,shared:sh,filters:{folder:S.folder,client:S.client,q:S.q,seg:S.seg,box:S.box,snd:S.snd,hideRcpt:S.hideRcpt,hideDur:S.hideDur}}),'Nézet mentve').then(()=>$('#dlg').close())}
});

/* Irattípus-választó: csoportosított, gépelésre szűrő lista a böngésző beépített listája helyett */
const tFold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const tselList=inp=>inp.parentNode.querySelector('.tlist');
function tselClose(inp){const L=tselList(inp);if(!L)return;L.hidden=true;inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant')}
function tselAct(inp,i){const L=tselList(inp),o=[...L.querySelectorAll('.o')];if(!o.length)return;i=Math.max(0,Math.min(i,o.length-1));
  o.forEach((x,n)=>{x.classList.toggle('on',n===i);x.setAttribute('aria-selected',n===i)});inp.setAttribute('aria-activedescendant',o[i].id);return o[i]}
function tselDraw(inp){const L=tselList(inp),q=tFold(inp.value.trim());
  const hit=TYPES.filter(t=>!q||tFold(t.label+' '+t.group).includes(q));
  const hl=s=>{const p=q?tFold(s).indexOf(q):-1;return p<0?esc(s):esc(s.slice(0,p))+'<mark>'+esc(s.slice(p,p+q.length))+'</mark>'+esc(s.slice(p+q.length))};
  const groups=[...new Set(hit.map(t=>t.group))].sort((a,b)=>a.localeCompare(b,'hu'));let n=0;
  L.innerHTML=hit.length?groups.map(g=>`<div class="g">${hl(g)}</div>`+hit.filter(t=>t.group===g).map(t=>{const m=t.label.match(/^(.+?)\s*\((.+)\)$/);
    return `<div class="o" role="option" id="topt${n++}" data-v="${esc(t.label)}"><span>${hl(m?m[1]:t.label)}</span>${m?`<small>${hl(m[2])}</small>`:''}</div>`}).join('')).join('')
    :'<div class="none">Nincs ilyen irattípus a listában. A beírt szöveggel így is besorolhatod.</div>';
  L.hidden=false;L.scrollTop=0;inp.setAttribute('aria-expanded','true');inp.removeAttribute('aria-activedescendant');if(q&&hit.length)tselAct(inp,0)}
const tselPick=(inp,o)=>{inp.value=o.dataset.v;tselClose(inp)};
document.addEventListener('focusin',e=>{if(e.target.matches?.('.tsel input'))tselDraw(e.target)});
document.addEventListener('input',e=>{if(e.target.matches?.('.tsel input'))tselDraw(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches?.('.tsel input'))tselClose(e.target)});
document.addEventListener('mousedown',e=>{if(e.target.closest?.('.tlist'))e.preventDefault()});
document.addEventListener('mousemove',e=>{const o=e.target.closest?.('.tlist .o');if(!o||o.classList.contains('on'))return;const L=o.parentNode;tselAct(L.parentNode.querySelector('input'),[...L.querySelectorAll('.o')].indexOf(o))});
document.addEventListener('click',e=>{const o=e.target.closest('.tlist .o');if(o)tselPick(o.closest('.tsel').querySelector('input'),o);else if(e.target.matches('.tsel input')&&tselList(e.target).hidden)tselDraw(e.target)});
document.addEventListener('keydown',e=>{const inp=e.target;if(!inp.matches?.('.tsel input'))return;const L=tselList(inp),o=[...L.querySelectorAll('.o')],i=o.findIndex(x=>x.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(L.hidden){tselDraw(inp);return}const x=tselAct(inp,e.key==='ArrowDown'?i+1:Math.max(i-1,0));x&&x.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&!L.hidden&&i>=0){e.preventDefault();tselPick(inp,o[i])}
  else if(e.key==='Escape'&&!L.hidden){e.stopPropagation();tselClose(inp)}
},true);

document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'');
  if(e.key==='Escape'){if($('#menu').innerHTML){closeMenu();return} if(S.tables?.expOpen){S.tables.expOpen=false;const p=$('#tablesExpPop');if(p)p.hidden=true;document.querySelector('[data-tables-expmenu]')?.focus();return} if(S.cal?.fopen){S.cal.fopen=false;render();document.querySelector('[data-calfopen]')?.focus();return} if(typing){e.target.blur();return} $('#app').classList.remove('open');document.getElementById(S.sel)?.focus();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||$('#dlg').open) return;
  if(S.area==='kapu'&&e.key!=='/'&&e.key!=='?')return;
  const v=visible(), i=v.findIndex(m=>m.id===S.sel), m=v[i], k=e.key.toLowerCase();
  const narrow=innerWidth<=1180;
  if(k==='j'||e.key==='ArrowDown'){if(e.target.closest?.('.detail')&&e.key==='ArrowDown')return;e.preventDefault();const n=v[Math.min(i+1,v.length-1)];if(n)select(n.id,true,!narrow)}
  else if(k==='k'||e.key==='ArrowUp'){if(e.target.closest?.('.detail')&&e.key==='ArrowUp')return;e.preventDefault();const n=v[Math.max(i-1,0)];if(n)select(n.id,true,!narrow)}
  else if(e.key==='Enter'&&e.target.classList?.contains('row')){e.preventDefault();select(e.target.dataset.id,false);$('#detail').focus()}
  else if(e.key==='/'){e.preventDefault();(S.area==='tables'?$('#tableq'):S.area==='upo'?$('#upoq'):S.area==='clients'&&S.cv?$('#cdq'):$('#q'))?.focus()}
  else if(e.key==='?'){showHelp()}
  else if(m&&k==='x'){S.checked.has(m.id)?S.checked.delete(m.id):S.checked.add(m.id);renderRows();document.getElementById(m.id)?.focus()}
  else if(m&&k==='a')act(m,'me'); else if(m&&k==='u')act(m,'read'); else if(m&&k==='e')act(m,'done');
});
addEventListener('hashchange',()=>{});
const BOOT0=performance.now(),bootOff=()=>setTimeout(()=>{const b=$('#boot');if(!b)return;b.classList.add('off');setTimeout(()=>b.remove(),600)},Math.max(0,700-(performance.now()-BOOT0)));
readHash(); if(innerWidth<760)$('#app').classList.remove('nofold'); syncCalFold(); load().catch(e=>{if(e.message!=='auth')bootOff();throw e}).then(()=>{bootOff(); if(!S.sel&&innerWidth>1180&&S.area==='inbox'){const v=visible()[0]; if(v){S.sel=v.id;render()}} });
