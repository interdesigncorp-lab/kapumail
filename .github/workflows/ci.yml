name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and test Laravel App
        run: |
          cd app
          composer install --no-interaction --prefer-dist
          cp -n .env.example .env
          php artisan key:generate
          php artisan test

      - name: Install and test Desktop
        run: |
          cd desktop
          npm ci
          npm test
