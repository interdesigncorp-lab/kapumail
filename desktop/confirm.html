<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file:; script-src 'self' file:">
<title>KapuMail – letöltés megerősítése</title>
<!-- A letöltés megerősítő kérdése: helyi oldal a felület fölött, a főfolyamat saját rétegében (lásd confirm-view.js). -->
<style>
html,body{margin:0;height:100%;background:transparent;font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a1733;cursor:default;user-select:none}
#scrim{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:rgba(255,255,255,.58);backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);opacity:0;transition:opacity .16s ease}
.ready #scrim{opacity:1}
main{box-sizing:border-box;width:min(432px,100%);padding:26px 26px 22px;border-radius:24px;background:#fff;box-shadow:0 34px 80px -24px rgba(48,28,110,.42),0 0 0 1px rgba(40,30,90,.08);transform:translateY(10px) scale(.975);opacity:0;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .16s ease}
.ready main{transform:none;opacity:1}
/* fejléc: a kabala a letöltés jelével, mellette a kérdés és a következmény */
header{display:flex;gap:14px;align-items:flex-start}
.kapu{position:relative;flex:none;width:50px;height:46px;margin-top:1px}
.kapu img{width:50px;height:auto;display:block;-webkit-user-drag:none;transform:rotate(-6deg);filter:drop-shadow(0 5px 7px rgba(70,40,130,.22))}
.kapu i{position:absolute;right:-7px;bottom:-5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#1a1733;color:#fff;box-shadow:0 0 0 2.5px #fff}
.kapu i svg{width:12px;height:12px}
h1{margin:0;font-size:18px;line-height:1.25;font-weight:700;letter-spacing:-.012em}
#lead{margin:5px 0 0;font-size:13px;line-height:1.45;color:#6b6786}
[data-state=unread] #lead,[data-state=unknown] #lead{color:#8a4b00}
/* az irat: kitől – kinek, a tárgy, alatta az adatok */
.doc{margin:18px 0 0;padding:16px 0 0;border-top:1px solid rgba(40,30,90,.10)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who+.who{margin-top:10px}
.av{flex:none;width:36px;height:36px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.01em;overflow:hidden}
.av.org{border-radius:11px;background:#1a1733;color:#fff}
.av.org.logo{background:#fff;box-shadow:inset 0 0 0 1px rgba(40,30,90,.12)}
.av.org img{width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box}
.av.me{border-radius:50%;background:#ece8ff;color:#4a36e0}
.who div{min-width:0}
.who small{display:block;font-size:11.5px;color:#6b6786;line-height:1.2}
.who b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text}
.who b span{font-weight:500;color:#6b6786}
#subject{margin:16px 0 0;font-size:15px;font-weight:650;line-height:1.35;overflow-wrap:anywhere;user-select:text;max-height:4.1em;overflow:auto}
dl{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;line-height:1.4;color:#4a4666}
dl>div{display:flex;gap:5px}
dt{color:#8a86a3}
dd{margin:0;overflow-wrap:anywhere;user-select:text}
.pill{display:inline-block;margin:12px 0 0;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#f1effa;color:#4a4666}
[data-state=unread] .pill{background:#ffedd1;color:#8a4b00}
[data-state=opened] .pill{background:#def5e7;color:#14633a}
footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
button{font:inherit;font-size:14px;font-weight:650;border:0;border-radius:13px;padding:10px 17px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .12s,transform .08s}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid #4a36e0;outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.sec{background:rgba(26,23,51,.07);color:#1a1733}.sec:hover:not(:disabled){background:rgba(26,23,51,.12)}
.pri{background:#1a1733;color:#fff}.pri:hover:not(:disabled){background:#2b2742}
.pri svg{width:16px;height:16px}
.pri.busy{opacity:1}.pri.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#scrim,main{transition:none}.pri.busy svg{animation:none}}
</style></head>
<body><div id="scrim"><main role="alertdialog" aria-modal="true" aria-labelledby="title" aria-describedby="lead">
  <header>
    <div class="kapu" aria-hidden="true"><img src="assets/plush.png" alt="" draggable="false"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v12"/><path d="m6.5 11.5 5.5 5.5 5.5-5.5"/></svg></i></div>
    <div><h1 id="title"></h1><p id="lead"></p></div>
  </header>
  <section class="doc">
    <div class="who" id="sender-row"><span class="av org" id="senderMark" aria-hidden="true"></span><div><small>Feladó</small><b id="sender"></b></div></div>
    <div class="who"><span class="av me" id="mailboxMark" aria-hidden="true"></span><div><small>Postafiók</small><b><span id="mailbox" style="font-weight:600;color:inherit"></span> <span id="mailboxKey"></span></b></div></div>
    <p id="subject"></p>
    <dl>
      <div id="received-row"><dt>Érkezett</dt><dd id="received"></dd></div>
      <div id="folder-row"><dt>Mappa</dt><dd id="folder"></dd></div>
      <div id="size-row"><dt>Méret</dt><dd id="size"></dd></div>
      <div id="type-row"><dt>Típus a tárhelyen</dt><dd id="type"></dd></div>
    </dl>
    <span class="pill" id="stateLabel"></span>
  </section>
  <footer>
    <button class="sec" id="no" type="button">Mégse</button>
    <button class="pri" id="yes" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg>Letöltés</button>
  </footer>
</main></div>
<script src="confirm-screen.js"></script>
</body></html>
