<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file:; script-src 'self' file:">
<title>KapuMail – zárolva</title>
<!-- Zárképernyő: helyi oldal a felület fölött. A kártya a macOS azonosítóablakának elrendezését követi, a KapuMail színeivel. -->
<style>html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a1733}
body{display:grid;place-items:center;background:linear-gradient(135deg,#f6dbe9 0%,#e6dbf7 38%,#dcd8fa 62%,#f7e4dc 100%);-webkit-app-region:drag;cursor:default;user-select:none}
main{box-sizing:border-box;width:min(340px,90vw);padding:28px 26px 22px;border-radius:28px;background:rgba(255,255,255,.86);box-shadow:0 30px 70px -22px rgba(60,35,120,.42),0 2px 8px rgba(60,35,120,.08),inset 0 0 0 1px rgba(255,255,255,.9);text-align:center;-webkit-app-region:no-drag;animation:in .28s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
main.shake{animation:shake .32s}
.badge{position:relative;width:76px;height:76px;margin:0 auto 18px}
.disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 6px 16px -6px rgba(212,80,140,.45),inset 0 0 0 1px rgba(26,23,51,.07)}
.disc svg{width:50px;height:50px}
.badge img{position:absolute;right:-12px;bottom:-8px;width:40px;height:auto;filter:drop-shadow(0 4px 6px rgba(70,40,130,.28));-webkit-user-drag:none}
h1{margin:0 0 10px;font-size:17px;font-weight:700;letter-spacing:-.01em}
p{margin:0;font-size:14.5px;line-height:1.4;color:#2c2850}
p+p{margin-top:12px;color:#5b557a}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
button{font:inherit;font-size:14.5px;font-weight:600;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;transition:filter .12s,transform .08s}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid #4a36e0;outline-offset:2px}
button:disabled,input:disabled{opacity:.5;cursor:default}
.pri{background:#4a36e0;color:#fff;box-shadow:0 6px 14px -6px rgba(74,54,224,.7)}.pri:hover:not(:disabled){filter:brightness(1.08)}
.sec{background:rgba(26,23,51,.08);color:#1a1733}.sec:hover:not(:disabled){background:rgba(26,23,51,.12)}
input{box-sizing:border-box;width:100%;padding:11px 16px;border-radius:999px;border:1px solid rgba(74,54,224,.25);background:#fff;font:inherit;font-size:15px;color:inherit;outline:none;text-align:center;letter-spacing:.2em}
input::placeholder{letter-spacing:0;color:#9a95b5}
input:focus-visible{border-color:#4a36e0;box-shadow:0 0 0 3px rgba(74,54,224,.18)}
input.code{letter-spacing:.06em;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
input.code::placeholder{text-transform:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
#msg{min-height:18px;margin-top:10px;font-size:12.5px;color:#b3261e;text-align:center}
.lnk{margin-top:4px;padding:6px 10px;background:none;font-size:12.5px;font-weight:500;color:#5b557a}.lnk:hover{color:#4a36e0;text-decoration:underline}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){main,main.shake{animation:none}}
</style></head>
<body><main id="card">
  <div class="badge"><div class="disc">
    <svg id="ic-touch" viewBox="0 0 24 24" aria-hidden="true" hidden><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a9c"/><stop offset="1" stop-color="#c93a86"/></linearGradient></defs><path fill="url(#g)" d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 5.65c1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.47-6.54-1.47-9.4.01-1.36.7-2.5 1.7-3.4 2.96-.08.14-.23.21-.39.21zm6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39-2.57 0-4.66 1.97-4.66 4.39 0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.19.2.19.51 0 .71-.11.1-.24.15-.37.15zm7.17-1.85c-1.19 0-2.24-.3-3.1-.89-1.49-1.01-2.38-2.65-2.38-4.39 0-.28.22-.5.5-.5s.5.22.5.5c0 1.41.72 2.74 1.94 3.56.71.48 1.54.71 2.54.71.24 0 .64-.03 1.04-.1.27-.05.53.13.58.41.05.27-.13.53-.41.58-.57.11-1.07.12-1.21.12zM14.91 22c-.04 0-.09-.01-.13-.02-1.59-.44-2.63-1.03-3.72-2.1-1.4-1.39-2.17-3.24-2.17-5.22 0-1.62 1.38-2.94 3.08-2.94 1.7 0 3.08 1.32 3.08 2.94 0 1.07.93 1.94 2.08 1.94s2.08-.87 2.08-1.94c0-3.77-3.25-6.83-7.25-6.83-2.84 0-5.44 1.58-6.61 4.03-.39.81-.59 1.76-.59 2.8 0 .78.07 2.01.67 3.61.1.26-.03.55-.29.64-.26.1-.55-.04-.64-.29-.49-1.31-.73-2.61-.73-3.96 0-1.2.23-2.29.68-3.24 1.33-2.79 4.28-4.6 7.51-4.6 4.55 0 8.25 3.51 8.25 7.83 0 1.62-1.38 2.94-3.08 2.94s-3.08-1.32-3.08-2.94c0-1.07-.93-1.94-2.08-1.94s-2.08.87-2.08 1.94c0 1.71.66 3.31 1.87 4.51.95.94 1.86 1.46 3.27 1.85.27.07.42.35.35.61-.05.23-.26.38-.47.38z"/></svg>
    <svg id="ic-pin" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#4a36e0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8.2 10.5V8a3.800 3.800 0 0 1 7.600 0v2.500M12 14.300v2"/></svg>
  </div><img src="assets/plush.png" alt="" width="40" height="37" draggable="false"></div>
  <h1>KapuMail</h1>
  <p>A KapuMail zárolva van.</p>
  <p id="lead">A folytatáshoz add meg a PIN-kódodat.</p>
  <div class="acts" id="touchacts" hidden>
    <button class="pri" id="touch" type="button">Feloldás Touch ID-val</button>
    <button class="sec" id="usepin" type="button">PIN-kód használata…</button>
  </div>
  <form class="acts" id="f">
    <input id="pin" type="password" autocomplete="off" aria-label="PIN-kód" placeholder="PIN-kód" maxlength="64">
    <button class="pri" id="go">Feloldás</button>
    <button class="sec" id="back" type="button" hidden>Vissza a Touch ID-hoz</button>
  </form>
  <form class="acts" id="rf" hidden>
    <input id="rc" class="code" type="text" autocomplete="off" spellcheck="false" aria-label="Helyreállító kód" placeholder="Helyreállító kód" maxlength="32">
    <input id="np" type="password" autocomplete="off" aria-label="Új PIN-kód" placeholder="Új PIN-kód" maxlength="64">
    <input id="np2" type="password" autocomplete="off" aria-label="Új PIN-kód még egyszer" placeholder="Új PIN-kód még egyszer" maxlength="64">
    <button class="pri" id="rgo">Új PIN beállítása</button>
    <button class="sec" id="rback" type="button">Vissza</button>
  </form>
  <div id="msg" role="alert"></div>
  <button class="lnk" id="forgot" type="button">Elfelejtettem a PIN-kódot</button>
</main><script src="lock-screen.js"></script></body></html>
