<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Iratkapu – szerver beállítása</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;color:#1a1733;background:linear-gradient(135deg,#f6dbe9,#e6dbf7 40%,#dcd8fa 65%,#f7e4dc);-webkit-app-region:drag}
input,button,a{-webkit-app-region:no-drag}
main{width:min(480px,calc(100% - 32px));background:rgba(255,255,255,.85);border-radius:28px;padding:32px;box-shadow:0 18px 50px -18px rgba(60,35,120,.35)}
h1{font-size:22px;margin:0 0 6px}p{color:#4a4666;margin:0 0 16px;line-height:1.45}label{display:grid;gap:6px;font-size:13px;font-weight:600;color:#4a4666}
input{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid rgba(40,30,90,.2)}button{font:inherit;margin-top:14px;width:100%;padding:12px;border:0;border-radius:13px;background:#15131c;color:#fff;font-weight:600;cursor:pointer}
:focus-visible{outline:2.5px solid #4a36e0;outline-offset:2px}#err{color:#a3193a;font-weight:600;min-height:20px;margin-top:10px}</style></head>
<body><main><h1>Hol fut az iroda Iratkapu-szervere?</h1>
<p>Az asztali alkalmazás az iroda szerveréhez kapcsolódik. Add meg a címét – ezt az iroda adminjától kapod. A cím csak ezen a gépen tárolódik.</p>
<form id="f"><label>Szerver címe<input id="u" type="url" required placeholder="https://iratkapu.iroda.example" autofocus></label><button>Kapcsolódás</button><div id="err" role="alert"></div></form>
<script>
iratkapuDesktop.setup.get().then(c=>{u.value=c.url});
f.onsubmit=async e=>{e.preventDefault();err.textContent='Kapcsolódás…';const r=await iratkapuDesktop.setup.set(u.value);if(!r.ok)err.textContent=r.error};
</script></main></body></html>
